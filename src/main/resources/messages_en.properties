informationArgentina = The cooperative relationship between the Republic of Angola and the Republic of Argentina is positive and is reflected in the interest of both States in joining efforts to strengthen it. This relationship is governed in light of the General Cooperation Agreement, signed on August 27, 1985, the date on which the two countries established diplomatic relations. However, Angola and Argentina have, to date, signed several legal instruments, with emphasis on the General Agreement on Economic, Technical, Scientific, and Cultural Cooperation, initialed on April 16, 1988, an instrument that serves as the foundation for strengthening our relations. The Republic of Angola and the Republic of Argentina have always been guided by the strengthening of bilateral relations, which are now characterized as fruitful, established in various areas, particularly in the sectors of trade, technology transfer, agriculture, and human resource development.
informationBolivia = With the Plurinational State of Bolivia, Angola maintains relations within the framework of the principle of good coexistence and mutual support for candidacies at the level of Multilateral Organizations. It is on the basis of this principle that, in 2014, the two countries signed in the city of La Paz, on October 23 of that year, the Joint Communiqué on the Establishment of Diplomatic Relations between the Republic of Angola and the Plurinational State of Bolivia. Thus, on September 27, 2024, on the sidelines of the UN General Assembly, the Republic of Angola and the Plurinational State of Bolivia signed the Memorandum on the Political Consultation Mechanism, a document that formalizes regular exchanges of delegations in the political and diplomatic sphere. • In the meantime, and taking into account the current global political and diplomatic context, both countries are working towards holding the first meeting on Political Consultations and negotiating two Draft Agreements submitted by the Angolan side, namely: a Draft Agreement between the Venâncio de Moura Diplomatic Academy of the Ministry of Foreign Affairs of the Republic of Angola and the Diplomatic Academy of the Ministry of Foreign Affairs of the Plurinational State of Bolivia; • Draft Agreement on Visa Exemption for Diplomatic and Service Passports. With this initiative, Angola aims to strengthen its presence in the South American region in order to attract investors from this country to Angola, with the objective of boosting bilateral cooperation and expanding its international partners, taking into account the opportunities that each presents.
informationChile = The Republic of Angola and the Republic of Chile established political and diplomatic relations on July 19, 1990. Within the framework of these relations, both countries experienced a period of trade exchanges and delegations in various areas of political and economic interest. The highest point of these relations occurred in 2014, with the visit to our country by the then President Michelle Bachelet, during which the Joint Action Plan for strengthening cooperation relations between the two countries was signed. On May 19, 2025, His Excellency Azevedo Xavier Francisco, Ambassador Extraordinary and Plenipotentiary of the Republic of Angola to the Argentine Republic, and concurrently accredited to the Republic of Chile, presented his Letters of Credence, enabling him to carry out his diplomatic mission in that country, with the aim of strengthening and enhancing cooperation between Angola and Chile. We intend to develop fruitful cooperation with this country in the tourism sector, as Chile is a preferred tourist destination for people of various nationalities. At present, both countries are working to strengthen bilateral cooperation and are negotiating three new agreement proposals in the areas of human resources training, visa exemption for diplomatic and service passports, and the implementation of the Angola/Chile Joint Action Plan.
informationUruguay = The Republic of Angola and the Oriental Republic of Uruguay established political-diplomatic and cooperation relations on May 26, 1988, and since that date, these relations have gone through different stages of evolution and consolidation, which have been strengthened through exchanges of visits at the highest level, both in the political-diplomatic context and within the framework of South-South cooperation. The Republic of Angola and the Oriental Republic of Uruguay maintain an incipient bilateral cooperation, based solely on technical assistance, through the sending of specialized Uruguayan technicians to Angola, particularly in the fields of agriculture, livestock, capacity building, and sports. This is a situation we intend to change within the framework of better utilization that we aim to develop with your country. Taking into account present challenges, we also intend to boost cooperation in the field of Higher Education at various levels of training, in areas such as software development and the training of technicians in the field of Artificial Intelligence. We aim to develop fruitful cooperation with your country in the tourism sector, given that Uruguay is a preferred tourist destination for people of various nationalities. At present, both countries are working to strengthen bilateral cooperation and to attract entrepreneurs for technology transfer to our country, as well as preparing the 2nd Angola/Uruguay Bilateral Commission.
informationParaguay = The Republic of Angola and the Republic of Paraguay established political and diplomatic relations on April 21, 1995. The Republic of Angola accredited its first Ambassador Extraordinary and Plenipotentiary to the Republic of Paraguay, His Excellency Leovigildo da Costa e Silva, on June 21, 2007, with permanent residence in Brasília, Federative Republic of Brazil. With a view to strengthening and diversifying cooperation relations, both countries signed in June 2008 the General Agreement on Economic, Scientific, Technical, and Cultural Cooperation, as well as the Memorandum of Understanding for the Establishment of Consultations between the Ministry of Foreign Affairs of the Republic of Angola and the Ministry of Foreign Affairs of the Republic of Paraguay. Accordingly, and taking into account the current global political and diplomatic context, both countries are working towards holding the first meeting on Political Consultations and negotiating three agreement proposals: Proposal for an Agreement on Visa Exemption for Diplomatic and Service Passports; Trade Agreement between both Governments; Agreement on the functioning of the Bilateral Commission between both Governments; and Draft Agreement in the field of Higher Education between both Governments. With this initiative, Angola aims to strengthen its presence in the South American region and attract investors from this country to Angola, with the objective of boosting bilateral cooperation and expanding its international partners, considering the opportunities that each country offers.

