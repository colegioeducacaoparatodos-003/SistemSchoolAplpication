############################################################
# APPLICATION
############################################################
spring.application.name=SistemSchool
server.port=${PORT:8080}
server.address=0.0.0.0
spring.main.allow-bean-definition-overriding=true
#spring.main.lazy-initialization=true
server.forward-headers-strategy=native

# Spring MVC fica em /api/* para nao conflitar com JSF
spring.mvc.servlet.path=/api

############################################################
# JSF
############################################################
jakarta.faces.STATE_SAVING_METHOD=server
jakarta.faces.PARTIAL_STATE_SAVING=true
jakarta.faces.ENABLE_CDI_RESOLVER=true
jakarta.faces.PROJECT_STAGE=Production

############################################################
# PRIMEFACES
############################################################
primefaces.THEME=saga
primefaces.FONT_AWESOME=true
primefaces.UPLOADER=commons
primefaces.UPLOAD_MAX_FILE_SIZE=10485760
primefaces.UPLOAD_MAX_FILES=10
primefaces.SUBMIT=partial
primefaces.PRIVATE_CAPTCHA_KEY=false

############################################################
# UPLOAD
############################################################
spring.servlet.multipart.enabled=false
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
spring.servlet.multipart.location=${java.io.tmpdir}

############################################################
# JPA / HIBERNATE
############################################################
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

############################################################
# MYSQL - RAILWAY
############################################################
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

############################################################
# SESSION
############################################################
server.servlet.session.timeout=59m

############################################################
# EMAIL
############################################################
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=jacirosidev@gmail.com
spring.mail.password=rjtm xesu ndbd typn
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

############################################################
# LOG
############################################################
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

############################################################
# ACTUATOR
############################################################
management.endpoints.web.exposure.include=startup

############################################################
# CONSOLE
############################################################
spring.output.ansi.enabled=ALWAYS
