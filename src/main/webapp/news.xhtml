<ui:composition template="./components/public/public-pages-layout.xhtml" xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:fn="http://xmlns.jcp.org/jsf/functions"
    id="maintenanceKpiSidebar">

    <f:metadata>
    </f:metadata>

    <ui:define name="titulo">
        #{msg.news}
    </ui:define>


    <ui:define name="content">
        <style>

        </style>


        <h:body>
            <h:form id="newsForm">

                <section class="news-page-container">

                    <div class="title-container">
                        <h1 class="title">#{msg.currentAffaires}</h1>
                    </div>

                    <ul class="filters">
                        <li class="filter active"><i class="pi pi-th-large"></i> #{msg.allNews}</li>
                        <li class="filter"><i class="pi pi-info-circle"></i> #{msg.consular}</li>
                        <li class="filter"><i class="pi pi-megaphone"></i> #{msg.pressReleases}</li>
                        <li class="filter"><i class="pi pi-briefcase"></i> #{msg.tradeAndEconomy}</li>
                        <li class="filter"><i class="pi pi-calendar"></i> #{msg.events}</li>
                        <li class="filter"><i class="pi pi-book"></i> #{msg.education}</li>
                    </ul>

                    <!-- <panelGroup class="cards-container"> -->

                     <p:dataScroller value="#{newsController.lazyModel}" var="item" rows="10" chunkSize="10"
                            mode="horizontal">

                            <a href="./show-news.xhtml">
                                <div class="card">
                                    <img src="/news_images/#{item.imageUrl}" alt="" />
                                    <div class="content">
                                        <p class="date">#{item.publishedAt}</p>
                                        <h4 class="title">
                                            #{item.title}
                                            <span><i class="pi pi-arrow-right"></i></span>
                                        </h4>
                                        <p class="category">#{item.category}</p>
                                    </div>
                                </div>
                            </a>
                        </p:dataScroller>
                       
                    <!-- </panelGroup> -->

                </section>
            </h:form>
            <ui:include src="./components/public/footer.xhtml" />
        </h:body>
    </ui:define>
</ui:composition>
