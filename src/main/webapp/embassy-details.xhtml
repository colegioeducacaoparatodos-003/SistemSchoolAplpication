<ui:composition template="./components/public/public-pages-layout.xhtml" xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:fn="http://xmlns.jcp.org/jsf/functions"
    id="maintenanceKpiSidebar">

    <f:metadata>
    <f:viewParam name="country" value="#{embassyDetailsController.country}" />
    <f:viewAction action="#{embassyDetailsController.loadData}" />
</f:metadata>

    <ui:define name="titulo">
        #{msg.biographyOfThePresidentOfTheRepublic}
    </ui:define>



    <ui:define name="content">

    <f:view locale="#{languageController.locale}"> 
        <h:body class="president-biography">
            <h:form id="newsForm">

                <section class="president-biography-page-container">

                    <div class="title-container">
                        <h1 class="title">#{embassyDetailsController.name}</h1>
                    </div>

                    <div class="main-content">

                        <div class="profile-header">

                            <div class="profile-image">
                                <img src="#{request.contextPath}/resources/imgs/#{embassyDetailsController.image}"
                                    alt="Presidente da República de Angola" class="president-img" />
                            </div>

                            <div class="profile-info">
                                <p:tag value="#{msg.description}" severity="info" styleClass=" tag" />

                                <h2 class="president-name">
                                    #{embassyDetailsController.title}
                                </h2>

                                <div class="president-meta">
                                    <p><strong>Cop:</strong>#{embassyDetailsController.cooperationDate}</p>
                                </div>

                            </div>

                        </div>

                        <div class="bio-text">

                            <h3>#{msg.learnMore}</h3>
                            <p>
                                #{embassyDetailsController.info}
                            </p>
                        </div>
                    </div>


                    <div class="quick-links-embassadors-section ">
                        
                            <div class="embassador-link-container" >
                                 
                                <p:commandLink href="/embassadors.xhtml" class="embassador-card"  action="#{governmentController.loadGovernmentPage}">
                                    <div class="embassador-content">
                                        <div class="ambassador-info">
                                            <h2 class="link-title">Embaixadores de Angola</h2>
                                    
                                        </div>
                                        <div class="embassador-action">
                                            <span class="action-text">Ver todos</span>
                                            <i class="pi pi-arrow-right icon-container"></i>
                                        </div>
                                    </div>
                                </p:commandLink >
                            </div>
                    </div>
                </section>
            </h:form>
            <ui:include src="./components/public/footer.xhtml" />
        </h:body>
        </f:view>
    </ui:define>

</ui:composition>
