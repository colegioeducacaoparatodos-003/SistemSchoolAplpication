<ui:composition template="../components/dashboard/dashboard-layout.xhtml" xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:fn="http://xmlns.jcp.org/jsf/functions">



    <!-- <a href=""></a> -->
    <ui:define name="titulo">
        News
    </ui:define>


    <ui:define name="content">
        <style>
            .header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 1rem;

            }

            .header .title {
                font-size: 1.4rem;
                font-weight: 400;
            }
        </style>
        <h:form id="dashboardForm">
            <h:panelGroup class="header">
                <h1 class="title">News</h1>

                <p:commandButton styleClass="create-button" value="Create News" type="button"
                    onclick="PF('createDialog').show()" />
            </h:panelGroup>



            <p:dataTable value="#{newsController.lazyModel}" var="item" lazy="true" paginator="true"
                paginatorPosition="bottom" rows="10" emptyMessage="No data found..."
                paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                currentPageReportTemplate="{startRecord}-{endRecord} of {totalRecords} records"
                rowsPerPageTemplate="5,10,20">

                <p:column headerText="Title">
                    <h:outputText value="#{item.title}" />
                </p:column>

                <p:column headerText="Subtitle">
                    <h:outputText value="#{item.subtitle}" />
                </p:column>

                <p:column headerText="Author">
                    <h:outputText value="#{item.author}" />
                </p:column>

                <p:column headerText="Category">
                    <h:outputText value="#{item.category}" />
                </p:column>

                <p:column headerText="Published At">
                    <h:outputText value="#{item.publishedAt}">
                        <f:convertDateTime type="localDateTime" pattern="dd/MM/yyyy HH:mm" />
                    </h:outputText>
                </p:column>

                <!-- <p:column headerText="Preview" exportable="false">
        <p:graphicImage value="#{item.thumbnailUrl}" 
                        rendered="#{not empty item.thumbnailUrl}" 
                        style="width: 50px; height: auto; border-radius: 4px;"/>
        <h:outputText value="No Image" rendered="#{empty item.thumbnailUrl}" style="color: #ccc; font-style: italic" />
    </p:column> -->

                <p:column headerText="Actions">
                    <p:button icon="pi pi-pencil" styleClass="rounded-button ui-button-flat ui-button-warning" />

                    <p:button icon="pi pi-trash" styleClass="rounded-button ui-button-flat ui-button-danger" />

                    <p:button icon="pi pi-eye" styleClass="rounded-button ui-button-flat ui-button-secondary" />
                </p:column>

            </p:dataTable>


            <p:dialog styleClass="create-news-dialog" widgetVar="createDialog" showEffect="fade" modal="true"
                closeOnEscape="true">
                <p:tabView>

                    <p:tab title="General">
                        <p:scrollPanel mode="native">
                            <div class="form-section">

                                <h:outputText class="label-for-input" value="Title" />
                                <p:inputText value="#{newsController.news.title}" styleClass="w-full" />

                                <h:outputText class="label-for-input" value="Subtitle" />
                                <p:inputText value="#{newsController.news.subtitle}" styleClass="w-full" />

                                <h:outputText class="label-for-input" value="Category" />
                                <p:inputText value="#{newsController.news.category}" styleClass="w-full" />

                                <h:outputText class="label-for-input" value="Author" />
                                <p:inputText value="#{newsController.news.author}" styleClass="w-full" />
                            </div>



                            <div class="upload-group">
                                <p:outputLabel value="Thumbnail" styleClass="upload-label" />
                                <div class="transparentUploadFile upload-container">
                                    <p:fileUpload id="thumbnailUrl" mode="simple" skinSimple="true"
                                        allowTypes="/(\.|\/)(gif|jpe?g|png|pdf)$/" label="#{msg.uploadImage}"
                                        styleClass="upload-button" value="#{newsController.news.thumbnailUrl}" />
                                </div>
                            </div>

                            <div class="upload-group">
                                <p:outputLabel value="Main Image" styleClass="upload-label" />
                                <div class="transparentUploadFile upload-container">
                                    <p:fileUpload id="imageUrl" mode="simple" skinSimple="true"
                                        allowTypes="/(\.|\/)(gif|jpe?g|png|pdf)$/" label="#{msg.uploadImage}"
                                        styleClass="upload-button" value="#{newsController.news.imageUrl}" />
                                </div>
                            </div>
                        </p:scrollPanel>
                    </p:tab>



                    <p:tab title="Content">
                        <p:scrollPanel mode="native">

                            <div class="form-section">
                                <h:outputText class="label-for-input" value="Short Summary" />
                                <p:inputTextarea value="#{newsController.news.summary}" autoResize="false" rows="4"
                                    maxlength="500" counter="summaryCounter" counterTemplate="{0} characters remaining"
                                    styleClass="w-full" />
                                <h:outputText id="summaryCounter" style="display:block; margin-bottom:15px;" />
                            </div>

                            <div class="form-section">
                                <p:textEditor widgetVar="editor1" value="#{newsController.news.content}" secure="false"
                                    height="250px" />
                            </div>
                            <p:commandButton value="Save News" action="#{newsController.save}" update="@form"
                                styleClass="ui-button save-button" />
                        </p:scrollPanel>
                    </p:tab>
                </p:tabView>

            </p:dialog>
        </h:form>
    </ui:define>
</ui:composition>
