<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
</h:head>

<h:body>

    <h:form id="createForm" enctype="multipart/form-data">

        <p:dialog id="createDialogAgency" widgetVar="createDialogAgency" modal="true" showEffect="fade"
            closeOnEscape="true" styleClass="create-news-dialog">

            <div class="components-container">

                <!-- LEFT -->
                <div class="left-component">

                    <h1 class="title">Register Travel Agency</h1>

                    <!-- BASIC INFO -->
                    <div class="form-section">

                        <h:outputText class="label-for-input" value="Name" />
                        <p:inputText value="#{travelAgencyController.agency.name}" required="true"
                            styleClass="w-full" />

                        <h:outputText class="label-for-input" value="City" />
                        <p:inputText value="#{travelAgencyController.agency.city}" styleClass="w-full" />

                    </div>

                    <!-- CONTACT -->
                    <div class="form-section">

                        <h:outputText class="label-for-input" value="Phone" />
                        <p:inputText value="#{travelAgencyController.agency.phone}" styleClass="w-full" />

                        <h:outputText class="label-for-input" value="Website" />
                        <p:inputText value="#{travelAgencyController.agency.website}" styleClass="w-full" />

                    </div>

                </div>

                <p:divider layout="vertical" />

                <!-- RIGHT -->
                <div class="right-component">



                    <!-- MEDIA -->
                    <div class="form-section">

                        <h:outputText class="label-for-input" value="Logo" />

                        <p:fileUpload value="#{travelAgencyController.agency.logoUrl}" mode="simple" skinSimple="true"
                            allowTypes="/(\.|\/)(gif|jpe?g|png)$/" styleClass="w-full custom-upload-btn" />

                    </div>

                    <!-- ACTIONS -->
                    <div style="display:flex; gap:10px; margin-top:15px">

                        <p:commandButton value="Save" icon="pi pi-save" action="#{travelAgencyController.add}"
                            process="@form" update="@form :dashboardTable" onstart="showLoader()"
                            oncomplete="hideLoader(); PF('createDialogAgency').hide()"
                            styleClass="ui-button save-button" />

                    </div>

                </div>

            </div>

        </p:dialog>

    </h:form>

</h:body>

</html>
