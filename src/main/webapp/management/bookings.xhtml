<ui:composition template="../components/dashboard/dashboard-layout.xhtml" xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:fn="http://xmlns.jcp.org/jsf/functions">

    <!-- <a href=""></a> -->
    <ui:define name="titulo">
        #{msg.consularServices}
    </ui:define>

    <ui:define name="content">
        <style>

        </style>
        <h:form id="dashboardTable" class="dashboard-form">
            <p:growl id="msg" />
            <h:panelGroup class="table-header">
                <h1 class="table-title">Agendamentos</h1>
            </h:panelGroup>

               <p:dataTable id="bookingTable"
             styleClass="table"
             value="#{bookingController.lazyModel}"
             var="item"
             lazy="true"
             paginator="true"
             paginatorPosition="bottom"
             rows="10"
             emptyMessage="No data found..."
             paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
             currentPageReportTemplate="{startRecord}-{endRecord} of {totalRecords} records"
             rowsPerPageTemplate="5,10,20">

    <!-- Serviço -->
    <p:column headerText="Service">
        <h:outputText value="#{item.serviceName}" />
    </p:column>

    <!-- Nome -->
    <p:column headerText="Full Name">
        <h:outputText value="#{item.fullName}" />
    </p:column>

    <!-- Email -->
    <p:column headerText="Email">
        <h:outputText value="#{item.email}" />
    </p:column>

    <!-- Telefone -->
    <p:column headerText="Phone">
        <h:outputText value="#{item.phone}" />
    </p:column>

    <!-- Data -->
    <p:column headerText="Date">
        <h:outputText value="#{item.bookingDate}">
        </h:outputText>
    </p:column>

    <!-- Hora -->
    <p:column headerText="Time">
        <h:outputText value="#{item.bookingTime}" />
    </p:column>

    <!-- Status -->
    <p:column headerText="Status">
        <p:tag value="#{item.status}"
               severity="#{
                   item.status eq 'CONFIRMED' ? 'success' :
                   item.status eq 'PENDING' ? 'warning' :
                   'danger'
               }" />
    </p:column>

    <!-- Ações -->
    <p:column headerText="Actions">

        <!-- Confirmar -->
        <p:commandButton icon="pi pi-check"
                         title="Confirm"
                         styleClass="rounded-button ui-button-flat ui-button-success"
                         action="#{bookingController.confirm(item.pkBooking)}"
                         update="bookingTable" />

        <!-- Cancelar -->
        <p:commandButton icon="pi pi-times"
                         title="Cancel"
                         styleClass="rounded-button ui-button-flat ui-button-warning"
                         action="#{bookingController.cancel(item.pkBooking)}"
                         update="bookingTable" />

        <!-- Remover -->
        <p:commandButton icon="pi pi-trash"
                         title="Delete"
                         styleClass="rounded-button ui-button-flat ui-button-danger"
                         action="#{bookingController.delete(item.pkBooking)}"
                         update="bookingTable" />

    </p:column>

                </p:dataTable>
          

        </h:form>
      


    </ui:define>
</ui:composition>
