<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
        <!-- <ui:insert name="titulo">Signup</ui:insert> -->
    </title>

    <style>
        .create-news-dialog.ui-dialog {
            /* border: 2px solid red; */
            width: 80%;
            height: 80vh;
        }
        .create-news-dialog.ui-dialog .title{
            font-size: 1.4rem;
            margin-bottom: 2rem;
        }

        .components-container {
            display: flex;
            /* gap: .4rem; */
        }

        .left-component {
            width: 40%;
            display: flex;
            flex-direction: column;
        }

        .right-component {
            width: 60%;

        }

        .create-news-dialog.ui-dialog {
            width: 80% !important;
            height: 75vh !important;
        }

        .create-news-dialog.ui-dialog .ui-dialog-titlebar {
            padding: .5rem 1.5rem 0;
        }

        .create-news-dialog.ui-dialog .ui-dialog-content {
            height: 100%;
            overflow: hidden;
        }

        .create-news-dialog .ui-tabs .ui-tabs-panels .ui-tabs-panel {
            padding: 0;
            overflow-y: auto;
        }

        .create-news-dialog .ui-scrollpanel {
            width: 100%;
            height: 410px;
            border: none;
        }
    </style>

</h:head>

<h:body>

    <h:form id="createForm" enctype="multipart/form-data">

        <p:dialog id="createDialog" styleClass="create-news-dialog" widgetVar="createDialog" showEffect="fade"
            modal="true" closeOnEscape="true">

            <div class="components-container">
                <div class="left-component">
                    <h1 class="title">Preecha os campos para criar noticia</h1>
                    <div class="form-section">

                        <h:outputText class="label-for-input" value="Title" />
                        <p:inputText value="#{newsController.news.title}" styleClass="w-full" />

                        <h:outputText class="label-for-input" value="Subtitle" />
                        <p:inputText value="#{newsController.news.subtitle}" styleClass="w-full" />

                        <h:outputText class="label-for-input" value="Category" />
                        <p:inputText value="#{newsController.news.category}" styleClass="w-full" />

                        <h:outputText class="label-for-input" value="Author" />
                        <p:inputText value="#{newsController.news.author}" styleClass="w-full" />
                    </div>

                    <div class="upload-group">
                        <p:outputLabel value="Main Image" styleClass="upload-label" />
                        <div class="transparentUploadFile upload-container">

                            <p:fileUpload label="#{msg.chooseButton}" styleClass="custom-upload-btn"
                                value="#{newsController.news.imageUrlUtil}" skinSimple="true" mode="simple"
                                allowTypes="/(\.|\/)(gif|jpe?g|png)$/" />

                        </div>
                    </div>
                </div>

                <p:divider layout="vertical" />
                <div class="right-component">
                    <div class="form-section">
                        <h:outputText class="label-for-input" value="Short Summary" />
                        <p:inputTextarea value="#{newsController.news.summary}" autoResize="false" rows="4"
                            maxlength="500" counter="summaryCounter" counterTemplate="{0} characters remaining"
                            styleClass="w-full" />
                        <h:outputText id="summaryCounter" style="display:block; margin-bottom:15px;" />
                    </div>

                    <div class="form-section">
                        <p:textEditor widgetVar="editor1" value="#{newsController.news.content}" secure="false"
                            height="180px" />
                    </div>
                    <p:commandButton value="Save News" action="#{newsController.save}" 
                        process="@form" onstart="showLoader()" 
                        oncomplete="hideLoader(); PF('createDialog').hide()"
                        update=":dashboardTable" styleClass="ui-button save-button" />
                </div>

            </div>


        </p:dialog>

    </h:form>
</h:body>

</html>
