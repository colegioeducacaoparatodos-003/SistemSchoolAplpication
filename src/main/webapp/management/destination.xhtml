<ui:composition template="../components/dashboard/dashboard-layout.xhtml" xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:fn="http://xmlns.jcp.org/jsf/functions">

    <!-- <a href=""></a> -->
    <ui:define name="titulo">
        Destination
    </ui:define>

    <ui:define name="content">
        <style>
          
        </style>
        <h:form id="dashboardTable" class="dashboard-form">
            <p:growl id="msg" />
           
        <h:panelGroup class="table-header">
                <h1 class="table-title">News</h1>

                <p:commandButton styleClass="create-button" value="Create News" type="button"
                    onclick="PF('createDialog').show()" />
            </h:panelGroup>

              <p:dataTable  
                styleClass="table"
                id="destinationTable"
                paginatorPosition="bottom" 
                emptyMessage="No data found..."
                paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                currentPageReportTemplate="{startRecord}-{endRecord} of {totalRecords} records"
                rowsPerPageTemplate="5,10,20"
                
                value="#{destinationController.lazyModel}"
                var="d"
                lazy="true"
                paginator="true"
                rows="10"
                responsiveLayout="scroll">

                <p:column headerText="Image">
                    <p:graphicImage value="/destination_images/#{d.imageUrl}"
                                    width="80"/>
                </p:column>

                <p:column headerText="Name">
                    #{d.name}
                </p:column>

                <p:column headerText="City">
                    #{d.city}
                </p:column>

                <p:column headerText="Country">
                    #{d.country}
                </p:column>

                <p:column headerText="Category">
                    #{d.category}
                </p:column>

                <p:column headerText="Actions">

                    <p:commandButton icon="pi pi-trash"
                                    action="#{destinationController.delete(d.id)}"
                                    update="destinationTable"
                                    styleClass="ui-button-danger"/>

                </p:column>

            </p:dataTable>
           
        </h:form>
        <ui:include src="./destination/destination-create.xhtml" />


    </ui:define>
</ui:composition>
