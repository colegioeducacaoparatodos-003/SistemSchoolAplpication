<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui" xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <p:dialog id="editPagamentoDialog" widgetVar="editPagamentoDialog" header="#{msg.editPayment}" modal="true"
              showEffect="fade" hideEffect="fade" closeOnEscape="true" styleClass="sc-dialog-edit" width="800"
              dynamic="true" resizable="false" appendTo="@(body)">

        <h:form id="pagamentoEditForm" styleClass="ui-fluid">
            <div class="sc-create-body">
                <p:messages id="msgsEdit" showDetail="true" closable="true"/>

                <!-- 1 · IDENTIFICAÇÃO -->
                <div class="sc-section">
                    <div class="sc-section-title"><i class="pi pi-hashtag"></i> #{msg.paymentIdentification}</div>
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank" columnClasses="p-col-12 p-md-6, p-col-12 p-md-6">
                        <p:outputLabel for="numeroDocumento" value="#{msg.paymentNumber}" styleClass="sc-label req"/>
                        <p:inputText id="numeroDocumento" value="#{pagamentoController.editDto.numeroDocumento}" required="true"/>

                        <p:outputLabel for="estado" value="#{msg.status}" styleClass="sc-label"/>
                        <p:selectOneMenu id="estado" value="#{pagamentoController.editDto.estado}">
                            <f:selectItem itemLabel="— #{msg.select} —" itemValue="#{null}" noSelectionOption="true"/>
                            <f:selectItems value="#{pagamentoController.estados}" var="e"
                                           itemLabel="#{e.descricao}" itemValue="#{e}"/>
                        </p:selectOneMenu>

                        <p:outputLabel for="mesReferencia" value="#{msg.referenceMonth}" styleClass="sc-label"/>
                        <p:selectOneMenu id="mesReferencia" value="#{pagamentoController.editDto.mesReferencia}">
                            <f:selectItem itemLabel="— #{msg.select} —" itemValue="#{null}" noSelectionOption="true"/>
                            <f:selectItems value="#{pagamentoController.mesesReferencia}" var="m"
                                           itemLabel="#{m.descricao}" itemValue="#{m}"/>
                        </p:selectOneMenu>
                    </p:panelGrid>
                </div>

                <!-- 2 · VÍNCULOS -->
                <div class="sc-section">
                    <div class="sc-section-title"><i class="pi pi-link"></i> #{msg.linkedRecords}</div>
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank" columnClasses="p-col-12 p-md-6, p-col-12 p-md-6">
                        <p:outputLabel for="enrolment" value="#{msg.enrolment}" styleClass="sc-label req"/>
                        <p:selectOneMenu id="enrolment" value="#{pagamentoController.selectedEnrolmentId}" required="true">
                            <f:selectItem itemLabel="— #{msg.select} —" itemValue="#{null}" noSelectionOption="true"/>
                            <f:selectItems value="#{pagamentoController.enrolments}" var="enr"
                                           itemLabel="#{enr.enrolmentNumer} — #{enr.student.fullName}"
                                           itemValue="#{enr.phEnrolment}"/>
                        </p:selectOneMenu>

                        <p:outputLabel for="fee" value="#{msg.fee}" styleClass="sc-label req"/>
                        <p:selectOneMenu id="fee" value="#{pagamentoController.selectedFeeId}" required="true">
                            <f:selectItem itemLabel="— #{msg.select} —" itemValue="#{null}" noSelectionOption="true"/>
                            <f:selectItems value="#{pagamentoController.fees}" var="fee"
                                           itemLabel="#{fee.phFee}" itemValue="#{fee.phFee}"/>
                        </p:selectOneMenu>

                        <p:outputLabel for="cashBox" value="#{msg.cashBox}" styleClass="sc-label req"/>
                        <p:selectOneMenu id="cashBox" value="#{pagamentoController.selectedCashBoxId}" required="true">
                            <f:selectItem itemLabel="— #{msg.select} —" itemValue="#{null}" noSelectionOption="true"/>
                            <f:selectItems value="#{pagamentoController.cashBoxes}" var="cb"
                                           itemLabel="#{cb.cashBoxNumber}" itemValue="#{cb.phCashBox}"/>
                        </p:selectOneMenu>
                    </p:panelGrid>
                </div>

                <!-- 3 · VALORES (com cálculo em tempo real do total) -->
                <div class="sc-section accent">
                    <div class="sc-section-title"><i class="pi pi-money-bill"></i> #{msg.paymentDetails}</div>
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank" columnClasses="p-col-12 p-md-6, p-col-12 p-md-6">
                        <p:outputLabel for="valor" value="#{msg.value}" styleClass="sc-label req"/>
                        <p:inputNumber id="valor" widgetVar="valorWidgetEdit"
                                       value="#{pagamentoController.editDto.valor}"
                                       symbol="Kz " symbolPosition="p" decimalPlaces="2" required="true"
                                       onkeyup="calcularTotalEdit()" onchange="calcularTotalEdit()"/>

                        <p:outputLabel for="desconto" value="#{msg.discount}" styleClass="sc-label"/>
                        <p:inputNumber id="desconto" widgetVar="descontoWidgetEdit"
                                       value="#{pagamentoController.editDto.desconto}"
                                       symbol="Kz " symbolPosition="p" decimalPlaces="2"
                                       onkeyup="calcularTotalEdit()" onchange="calcularTotalEdit()"/>

                        <p:outputLabel for="multa" value="#{msg.fine}" styleClass="sc-label"/>
                        <p:inputNumber id="multa" widgetVar="multaWidgetEdit"
                                       value="#{pagamentoController.editDto.multa}"
                                       symbol="Kz " symbolPosition="p" decimalPlaces="2"
                                       onkeyup="calcularTotalEdit()" onchange="calcularTotalEdit()"/>

                        <p:outputLabel value="#{msg.total}" styleClass="sc-label"/>
                        <div class="sc-total-summary">
                            <h:outputText id="totalDisplay" value="#{pagamentoController.editDto.total}" styleClass="t-amount"/>
                            <h:inputHidden id="totalHidden" value="#{pagamentoController.editDto.total}"/>
                            <span class="sc-helper-text">#{msg.value} - #{msg.discount} + #{msg.fine}</span>
                        </div>

                        <p:outputLabel for="formaPagamento" value="#{msg.paymentMethod}" styleClass="sc-label req"/>
                        <p:selectOneMenu id="formaPagamento" value="#{pagamentoController.editDto.formaPagamento}" required="true">
                            <f:selectItem itemLabel="— #{msg.select} —" itemValue="#{null}" noSelectionOption="true"/>
                            <f:selectItems value="#{pagamentoController.formasPagamento}" var="fp"
                                           itemLabel="#{fp.descricao}" itemValue="#{fp}"/>
                        </p:selectOneMenu>

                        <p:outputLabel for="dataPagamento" value="#{msg.paymentDate}" styleClass="sc-label"/>
                        <p:datePicker id="dataPagamento" value="#{pagamentoController.editDto.dataPagamento}"
                                      pattern="dd/MM/yyyy HH:mm" showIcon="true"/>

                        <p:outputLabel for="referencia" value="#{msg.reference}" styleClass="sc-label"/>
                        <p:inputText id="referencia" value="#{pagamentoController.editDto.referencia}"/>
                    </p:panelGrid>

                    <p:outputLabel for="observacao" value="#{msg.observation}" styleClass="sc-label"/>
                    <p:inputTextarea id="observacao" value="#{pagamentoController.editDto.observacao}" rows="3"/>
                </div>

            </div>

            <div class="sc-create-footer">
                <p:commandButton value="#{msg.cancel}" icon="pi pi-times"
                                 styleClass="sc-btn-cancel"
                                 type="button"
                                 onclick="PF('editPagamentoDialog').hide()"/>

                <p:commandButton value="#{msg.save}" icon="pi pi-save"
                                 styleClass="sc-btn-save"
                                 action="#{pagamentoController.saveUpdate}"
                                 process="@form"
                                 update=":formPagamentos:dtPagamentos msgsEdit :formPagamentos:messages"
                                 oncomplete="if (!args.validationFailed) { PF('editPagamentoDialog').hide(); }"/>
            </div>
        </h:form>

        <script type="text/javascript">
            //<![CDATA[
            function calcularTotalEdit() {
                var valor = (window.PF && PF('valorWidgetEdit')) ? (PF('valorWidgetEdit').getValue() || 0) : 0;
                var desconto = (window.PF && PF('descontoWidgetEdit')) ? (PF('descontoWidgetEdit').getValue() || 0) : 0;
                var multa = (window.PF && PF('multaWidgetEdit')) ? (PF('multaWidgetEdit').getValue() || 0) : 0;

                var total = parseFloat(valor) - parseFloat(desconto) + parseFloat(multa);
                if (isNaN(total)) { total = 0; }

                var display = document.getElementById('pagamentoEditForm:totalDisplay');
                if (display) {
                    display.innerText = total.toLocaleString('pt-PT', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' Kz';
                }

                var hidden = document.getElementById('pagamentoEditForm:totalHidden');
                if (hidden) {
                    hidden.value = total;
                }
            }
            //]]>
        </script>
    </p:dialog>

</ui:composition>
