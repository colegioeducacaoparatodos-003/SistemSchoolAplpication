<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:p="http://primefaces.org/ui"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <!--
        IMPORTANTE: este ui:include NÃO pode ficar dentro do <h:form id="formDocuments">
        da página pai. Coloque-o como irmão do form principal, ex:

        <h:form id="formDocuments"> ... </h:form>
        <ui:include src="/.../createDocumentDialog.xhtml" />
        <ui:include src="/.../editDocumentDialog.xhtml" />

        HTML não permite <form> aninhado dentro de outro <form>; mesmo com
        appendTo="@(body)" o navegador já quebra a estrutura no parse inicial
        do HTML, antes do PrimeFaces mover o dialog via JS.
    -->

    <p:dialog id="createDocumentDialog" widgetVar="createDocumentDialog" header="#{msg.newDocument}" modal="true"
        showEffect="fade" hideEffect="fade" closeOnEscape="true" styleClass="doc-dialog-create" width="800"
        dynamic="true" resizable="false" appendTo="@(body)">

        <h:form id="documentCreateForm" styleClass="ui-fluid" enctype="multipart/form-data">
            <div class="sc-create-body">
                <p:messages id="msgsCreate" showDetail="true" closable="true" globalOnly="true" />

                <div class="sc-section">
                    <div class="sc-section-title"><i class="pi pi-file"></i> #{msg.documentDetails}</div>
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank"
                        columnClasses="p-col-12 p-md-6, p-col-12 p-md-6">

                        <p:outputLabel for="student" value="#{msg.student}" styleClass="sc-label req" />
                        <p:selectOneMenu id="student" value="#{documentController.selectedStudentId}" required="true"
                            filter="true" filterMatchMode="contains">
                            <f:selectItem itemLabel="— #{msg.select} —" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItems value="#{documentController.students}" var="st" itemLabel="#{st.fullName}"
                                itemValue="#{st.pkStudent}" />
                        </p:selectOneMenu>

                        <p:outputLabel for="documentNumber" value="#{msg.documentNumber}" styleClass="sc-label req" />
                        <p:inputText id="documentNumber" value="#{documentController.novoDocumento.documentNumber}"
                            required="true" />

                        <p:outputLabel for="documentType" value="#{msg.documentType}" styleClass="sc-label req" />
                        <p:selectOneMenu id="documentType" value="#{documentController.novoDocumento.documentType}"
                            required="true">
                            <f:selectItem itemLabel="— #{msg.select} —" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItems value="#{documentController.tiposDocumento}" var="t"
                                itemLabel="#{t.descricao}" itemValue="#{t}" />
                        </p:selectOneMenu>

                        <p:outputLabel for="issueDate" value="#{msg.issueDate}" styleClass="sc-label" />
                        <p:datePicker id="issueDate" value="#{documentController.novoDocumento.issueDate}"
                            pattern="dd/MM/yyyy" showIcon="true" />

                        <p:outputLabel for="expiryDate" value="#{msg.expiryDate}" styleClass="sc-label" />
                        <p:datePicker id="expiryDate" value="#{documentController.novoDocumento.expiryDate}"
                            pattern="dd/MM/yyyy" showIcon="true" />

                    </p:panelGrid>
                </div>

                <div class="sc-section">
                    <div class="sc-section-title"><i class="pi pi-upload"></i> #{msg.file}</div>
                    <p:fileUpload id="upload" listener="#{documentController.handleFileUpload}" mode="advanced"
                        auto="true" dragDropSupport="true" multiple="false" label="#{msg.chooseFile}"
                        uploadLabel="#{msg.upload}" cancelLabel="#{msg.cancel}"
                        update=":documentCreateForm:msgsCreate"
                        process="@this">
                        <p:validateFile sizeLimit="10000000" allowTypes="/(\.|\/)(pdf|jpe?g|png|docx?)$/" />
                    </p:fileUpload>
                </div>

                <div class="sc-section">
                    <div class="sc-section-title"><i class="pi pi-info-circle"></i> #{msg.additionalInformation}</div>
                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank">
                        <p:outputLabel for="notes" value="#{msg.notes}" styleClass="sc-label" />
                        <p:inputTextarea id="notes" value="#{documentController.novoDocumento.obs}" rows="3"
                            placeholder="#{msg.additionalNotesPlaceholder}" />
                    </p:panelGrid>
                </div>

            </div>

            <div class="sc-create-footer">
                <p:commandButton value="#{msg.cancel}" icon="pi pi-times" styleClass="sc-btn-cancel" type="button"
                    onclick="PF('createDocumentDialog').hide()" />

                <p:commandButton value="#{msg.save}" icon="pi pi-save" styleClass="sc-btn-save"
                    action="#{documentController.salvarDocumento}" process="@form"
                    update=":documentCreateForm:msgsCreate :formDocuments:dtDocuments"
                    oncomplete="if (!args.validationFailed) { PF('createDocumentDialog').hide(); }" />
            </div>
        </h:form>
    </p:dialog>

</ui:composition>
