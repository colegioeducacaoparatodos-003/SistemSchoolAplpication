<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui" xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <style>
        .sc-dialog-create .ui-dialog-content {
            padding: 0 !important;
            background: var(--surface-2, #f7f7f8);
            overflow-x: hidden;
        }

        .sc-create-body {
            max-height: 75vh;
            overflow-y: auto;
            padding: clamp(1rem, 2vw, 1.5rem);
            box-sizing: border-box;
        }

        .sc-create-body::-webkit-scrollbar {
            width: 5px;
        }
        .sc-create-body::-webkit-scrollbar-thumb {
            background: var(--border-dk, #cfcfd3);
            border-radius: 99px;
        }

        .sc-section {
            background: var(--surface, #ffffff);
            border: 1px solid var(--border, #e6e6e8);
            border-radius: var(--radius, 10px);
            padding: 1.2rem;
            margin-bottom: 1.2rem;
            box-shadow: 0 1px 3px rgba(20, 20, 20, .04);
        }

        .sc-section-title {
            font-size: .88rem;
            font-weight: 700;
            color: var(--black, #141414);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border, #e6e6e8);
            padding-bottom: .6rem;
        }

        .sc-section-title i {
            color: var(--red, #c8102e);
            font-size: .95rem;
        }

        .sc-label {
            font-size: .8rem;
            font-weight: 600;
            color: var(--text, #141414) !important;
            display: block;
            margin-bottom: .3rem;
        }

        .sc-label.req::after {
            content: " *";
            color: var(--red, #c8102e);
        }

        /* Ajustes responsivos para os Inputs do PrimeFaces */
        .sc-create-body .ui-inputtext,
        .sc-create-body .ui-selectonemenu,
        .sc-create-body .ui-inputnumber {
            width: 100% !important;
        }

        .sc-create-body .ui-panelgrid.ui-panelgrid-blank .ui-panelgrid-cell {
            padding: .4rem .5rem !important;
        }

        .sc-create-footer {
            background: var(--surface, #ffffff);
            border-top: 1px solid var(--border, #e6e6e8);
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: .75rem;
            flex-wrap: wrap;
        }

        .sc-btn-cancel, .sc-btn-save {
            border-radius: var(--radius-sm, 6px) !important;
            font-size: .82rem !important;
            font-weight: 600 !important;
            padding: .5rem 1.2rem !important;
        }

        .sc-btn-cancel {
            background: var(--surface-2, #f7f7f8) !important;
            color: var(--text, #141414) !important;
            border: 1px solid var(--border, #e6e6e8) !important;
        }

        .sc-btn-save {
            background: linear-gradient(135deg, var(--black, #141414) 0%, var(--red, #c8102e) 100%) !important;
            border: none !important;
            color: #fff !important;
        }

        /* Responsividade para telas menores que 768px */
        @media (max-width: 768px) {
            .sc-create-footer {
                justify-content: stretch;
            }
            .sc-create-footer .ui-button {
                flex: 1;
            }
        }
    </style>

    <p:dialog id="createSchoolClassDialog" widgetVar="createSchoolClassDialog" header="#{msg.newSchoolClass}" modal="true"
              showEffect="fade" hideEffect="fade" closeOnEscape="true" styleClass="sc-dialog-create" width="750"
              dynamic="true" resizable="false" appendTo="@(body)" responsive="true">

        <h:form id="schoolClassCreateForm" styleClass="ui-fluid">
            <div class="sc-create-body">
                <p:messages id="msgsCreate" showDetail="true" closable="true" globalOnly="true"/>

                <div class="sc-section">
                    <div class="sc-section-title"><i class="pi pi-sitemap"></i> #{msg.schoolClassDetails}</div>
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank"
                                 columnClasses="col-12 md:col-6, col-12 md:col-6">

                        <p:outputLabel for="classCode" value="#{msg.classCode}" styleClass="sc-label req"/>
                        <p:inputText id="classCode" value="#{schoolClassController.schoolClass.classCode}" required="true"/>

                        <p:outputLabel for="className" value="#{msg.className}" styleClass="sc-label req"/>
                        <p:inputText id="className" value="#{schoolClassController.schoolClass.className}" required="true"/>

                        <p:outputLabel for="classe" value="#{msg.classe}" styleClass="sc-label req"/>
                        <p:selectOneMenu id="classe" value="#{schoolClassController.schoolClass.classe}" required="true">
                            <f:selectItem itemLabel="— #{msg.select} —" itemValue="#{null}" noSelectionOption="true"/>
                            <f:selectItems value="#{schoolClassController.classes}" var="cl" itemLabel="#{cl}" itemValue="#{cl}"/>
                        </p:selectOneMenu>

                        <p:outputLabel for="turno" value="#{msg.shift}" styleClass="sc-label req"/>
                        <p:selectOneMenu id="turno" value="#{schoolClassController.schoolClass.turno}" required="true">
                            <f:selectItem itemLabel="— #{msg.select} —" itemValue="#{null}" noSelectionOption="true"/>
                            <f:selectItems value="#{schoolClassController.turnos}" var="sh" itemLabel="#{sh}" itemValue="#{sh}"/>
                        </p:selectOneMenu>

                        <p:outputLabel for="anoLectivo" value="#{msg.academicYear}" styleClass="sc-label req"/>
                        <p:inputText id="anoLectivo" value="#{schoolClassController.schoolClass.anoLectivo}"
                                     placeholder="2025/2026" required="true"/>

                        <p:outputLabel for="capacidade" value="#{msg.capacity}" styleClass="sc-label req"/>
                        <p:inputNumber id="capacidade" value="#{schoolClassController.schoolClass.capacidade}"
                                       decimalPlaces="0" required="true"/>

                        <p:outputLabel for="room" value="#{msg.room}" styleClass="sc-label"/>
                        <p:inputText id="room" value="#{schoolClassController.schoolClass.room}" placeholder="Sala 7"/>

                        <p:outputLabel for="status" value="#{msg.status}" styleClass="sc-label req"/>
                        <p:selectOneMenu id="status" value="#{schoolClassController.schoolClass.status}" required="true">
                            <f:selectItem itemLabel="— #{msg.select} —" itemValue="#{null}" noSelectionOption="true"/>
                            <f:selectItems value="#{schoolClassController.statuses}" var="st" itemLabel="#{st}" itemValue="#{st}"/>
                        </p:selectOneMenu>

                    </p:panelGrid>
                </div>

                <div class="sc-section">
                    <div class="sc-section-title"><i class="pi pi-info-circle"></i> #{msg.additionalInformation}</div>
                     <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank">
                        <p:outputLabel for="notes" value="#{msg.notes}" styleClass="sc-label"/>
                        <p:inputTextarea id="notes" value="#{schoolClassController.schoolClass.obs}" rows="3"
                                         placeholder="#{msg.additionalNotesPlaceholder}"/>
                    </p:panelGrid>
                </div>

            </div>

            <div class="sc-create-footer">
                <p:commandButton value="#{msg.cancel}" icon="pi pi-times"
                                 styleClass="sc-btn-cancel"
                                 type="button"
                                 onclick="PF('createSchoolClassDialog').hide()"/>

                <p:commandButton value="#{msg.save}" icon="pi pi-save"
                                 styleClass="sc-btn-save"
                                 action="#{schoolClassController.saveSchoolClass}"
                                 process="@form"
                                 update=":schoolClassCreateForm:msgsCreate :formSchoolClasses:dtSchoolClasses"
                                 oncomplete="if (!args.validationFailed) { PF('createSchoolClassDialog').hide(); }"/>
            </div>
        </h:form>
    </p:dialog>

</ui:composition>
