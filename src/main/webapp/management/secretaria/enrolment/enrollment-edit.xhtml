<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:p="http://primefaces.org/ui"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <p:dialog id="editEnrollmentDialog" widgetVar="editEnrollmentDialog" header="#{msg.editEnrollment}" modal="true"
        showEffect="fade" hideEffect="fade" closeOnEscape="true" styleClass="sc-dialog-edit" width="800" dynamic="true"
        resizable="false" appendTo="@(body)">

        <h:form id="enrollmentEditForm" styleClass="ui-fluid">
            <div class="sc-create-body">
                <p:messages id="msgsEdit" showDetail="true" closable="true" />

                <div class="sc-section">
                    <div class="sc-section-title"><i class="pi pi-book"></i> #{msg.enrollmentDetails}</div>
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank"
                        columnClasses="p-col-12 p-md-6, p-col-12 p-md-6">

                        <p:outputLabel for="student" value="#{msg.student}" styleClass="sc-label req" />
                        <p:selectOneMenu id="student" value="#{enrolmentController.selectedStudentId}" required="true"
                            filter="true" filterMatchMode="contains">
                            <f:selectItem itemLabel="— #{msg.select} —" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItems value="#{enrolmentController.students}" var="s"
                                itemLabel="#{s.fullName} (#{s.sudentNumber})" itemValue="#{s.pkStudent}" />
                        </p:selectOneMenu>

                        <p:outputLabel for="enrollmentNumber" value="#{msg.enrollmentNumber}" styleClass="sc-label" />
                        <p:inputText id="enrollmentNumber" value="#{enrolmentController.editDto.enrolmentNumer}" />

                        <p:outputLabel for="schoolClass" value="#{msg.schoolClass}" styleClass="sc-label req" />
                        <p:selectOneMenu id="schoolClass" value="#{enrolmentController.selectedSchoolClassId}"
                            required="true" filter="true" filterMatchMode="contains">
                            <f:selectItem itemLabel="— #{msg.select} —" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItems value="#{enrolmentController.schoolClasses}" var="sc"
                                itemLabel="#{sc.classCode} — #{sc.className}" itemValue="#{sc.pkSchoolClass}" />
                        </p:selectOneMenu>

                        <p:outputLabel for="shift" value="#{msg.shift}" styleClass="sc-label req" />
                        <p:selectOneMenu id="shift" value="#{enrolmentController.editDto.shift}" required="true">
                            <f:selectItem itemLabel="— #{msg.select} —" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItems value="#{enrolmentController.shifts}" var="sh" itemLabel="#{sh}"
                                itemValue="#{sh}" />
                        </p:selectOneMenu>

                        <p:outputLabel for="enrollmentType" value="#{msg.enrollmentType}" styleClass="sc-label req" />
                        <p:selectOneMenu id="enrollmentType" value="#{enrolmentController.editDto.enrolmentType}"
                            required="true">
                            <f:selectItem itemLabel="— #{msg.select} —" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItems value="#{enrolmentController.enrolmentTypes}" var="et" itemLabel="#{et}"
                                itemValue="#{et}" />
                        </p:selectOneMenu>

                        <p:outputLabel for="enrollmentDate" value="#{msg.enrollmentDate}" styleClass="sc-label req" />
                        <p:datePicker id="enrollmentDate" value="#{enrolmentController.editDto.enrolmentData}"
                            pattern="dd/MM/yyyy" showIcon="true" required="true" />

                    </p:panelGrid>
                </div>

                <div class="sc-section">
                    <div class="sc-section-title"><i class="pi pi-info-circle"></i> #{msg.additionalInformation}</div>
                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank">
                        <p:outputLabel for="notes" value="#{msg.notes}" styleClass="sc-label" />
                        <p:inputTextarea id="notes" value="#{enrolmentController.editDto.obs}" rows="3"
                            placeholder="#{msg.additionalNotesPlaceholder}" />
                    </p:panelGrid>
                </div>

            </div>

            <div class="sc-create-footer">
                <p:commandButton value="#{msg.cancel}" icon="pi pi-times" styleClass="sc-btn-cancel" type="button"
                    onclick="PF('editEnrollmentDialog').hide()" />

                <p:commandButton value="#{msg.save}" icon="pi pi-save" styleClass="sc-btn-save"
                    action="#{enrolmentController.saveUpdate}"
                    update=":formEnrollments:dtEnrollments :formEnrollments:messages"
                    oncomplete="if (!args.validationFailed) { PF('editEnrollmentDialog').hide(); }" />
            </div>
        </h:form>
    </p:dialog>

</ui:composition>
