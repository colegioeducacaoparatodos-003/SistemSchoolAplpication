<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
        <!-- <ui:insert name="titulo">Signup</ui:insert> -->
    </title>

    <style>
        .create-news-dialog.ui-dialog {
            /* border: 2px solid red; */
            width: 80%;
            height: 80vh;
        }
        .create-news-dialog.ui-dialog .title{
            font-size: 1.4rem;
            margin-bottom: 2rem;
        }

        .components-container {
            display: flex;
            /* gap: .4rem; */
        }

        .left-component {
            width: 40%;
            display: flex;
            flex-direction: column;
        }

        .right-component {
            width: 60%;

        }

        .create-news-dialog.ui-dialog {
            width: 80% !important;
            height: 75vh !important;
        }

        .create-news-dialog.ui-dialog .ui-dialog-titlebar {
            padding: .5rem 1.5rem 0;
        }

        .create-news-dialog.ui-dialog .ui-dialog-content {
            height: 100%;
            overflow: hidden;
        }

        .create-news-dialog .ui-tabs .ui-tabs-panels .ui-tabs-panel {
            padding: 0;
            overflow-y: auto;
        }

        .create-news-dialog .ui-scrollpanel {
            width: 100%;
            height: 410px;
            border: none;
        }
    </style>

</h:head>

<h:body>

    <h:form id="createForm" enctype="multipart/form-data">

    <p:dialog id="createDialog"
          styleClass="create-news-dialog"
          widgetVar="createDialog"
          showEffect="fade"
          modal="true"
          closeOnEscape="true">

    <div class="components-container">

        <!-- LEFT -->
        <div class="left-component">

            <h1 class="title">Preencha os campos para criar serviço</h1>

            <div class="form-section">

                <h:outputText class="label-for-input" value="Service Name" />
                <p:inputText value="#{consularServiceController.consularService.name}" styleClass="w-full" />

                <h:outputText class="label-for-input" value="Requirements" />
                <p:inputTextarea value="#{consularServiceController.consularService.requirements}"
                                 rows="3" styleClass="w-full" />

                <h:outputText class="label-for-input" value="Fees" />
                <p:inputText value="#{consularServiceController.consularService.fees}" styleClass="w-full" />

                <h:outputText class="label-for-input" value="Price" />
                <p:inputNumber value="#{consularServiceController.consularService.price}"
                               symbol="Kz "
                               styleClass="w-full" />

            </div>

        </div>

        <p:divider layout="vertical" />

        <!-- RIGHT -->
        <div class="right-component">

            <div class="form-section">

                <h:outputText class="label-for-input" value="Details" />
                <p:inputTextarea value="#{consularServiceController.consularService.details}"
                                 rows="4" styleClass="w-full" />

                <h:outputText class="label-for-input" value="Status" />
                <p:selectOneMenu value="#{consularServiceController.consularService.status}" styleClass="w-full">
                    <f:selectItem itemLabel="Active" itemValue="ACTIVE"/>
                    <f:selectItem itemLabel="Inactive" itemValue="INACTIVE"/>
                </p:selectOneMenu>

                <h:outputText class="label-for-input" value="Available Days" />
                <p:inputText value="#{consularServiceController.consularService.availableDays}"
                             placeholder="Ex: Mon-Fri"
                             styleClass="w-full" />

            </div>

            <div class="form-section">
                <h:outputText class="label-for-input" value="Online Booking" />
                <p:toggleSwitch value="#{consularServiceController.consularService.onlineBooking}" />
            </div>

            <p:commandButton value="Save Service"
                             action="#{consularServiceController.add}"
                             process="@form"
                             onstart="showLoader()"
                             oncomplete="hideLoader(); PF('createServiceDialog').hide()"
                             update="@form :serviceTable"
                             styleClass="ui-button save-button" />

        </div>

    </div>

</p:dialog>

    </h:form>
</h:body>

</html>
