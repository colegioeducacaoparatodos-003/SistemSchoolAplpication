<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
        <!-- <ui:insert name="titulo">Signup</ui:insert> -->
    </title>


</h:head>

<h:body>

    <h:form id="createForm" enctype="multipart/form-data">

        <p:dialog id="createDialogHotel" widgetVar="createDialog" modal="true" showEffect="fade" closeOnEscape="true"
            styleClass="create-news-dialog">

            <div class="components-container">

                <!-- LEFT -->
                <div class="left-component">

                    <h1 class="title">Register Hotel</h1>

                    <!-- BASIC INFO -->
                    <div class="form-section">

                        <h:outputText class="label-for-input" value="Name" />
                        <p:inputText value="#{hotelController.hotel.name}" required="true" styleClass="w-full" />

                        <h:outputText class="label-for-input" value="City" />
                        <p:inputText value="#{hotelController.hotel.city}" styleClass="w-full" />

                        <h:outputText class="label-for-input" value="Address" />
                        <p:inputText value="#{hotelController.hotel.address}" styleClass="w-full" />

                    </div>

                    <!-- CONTACT -->
                    <div class="form-section">

                        <h:outputText class="label-for-input" value="Phone" />
                        <p:inputText value="#{hotelController.hotel.phone}" styleClass="w-full" />

                        <h:outputText class="label-for-input" value="Email" />
                        <p:inputText value="#{hotelController.hotel.email}" styleClass="w-full" />

                        <h:outputText class="label-for-input" value="Website" />
                        <p:inputText value="#{hotelController.hotel.website}" styleClass="w-full" />

                    </div>

                </div>

                <p:divider layout="vertical" />

                <!-- RIGHT -->
                <div class="right-component">

                    <!-- CLASSIFICATION -->
                    <div class="form-section">

                        <h:outputText class="label-for-input" value="Stars" />
                        <p:selectOneMenu value="#{hotelController.hotel.stars}" styleClass="w-full">

                            <f:selectItem itemLabel="Select stars" itemValue="0" />
                            <f:selectItems value="#{[1,2,3,4,5]}" />

                        </p:selectOneMenu>

                    </div>

                    <!-- LOCATION -->
                    <div class="form-section">

                        <h:outputText class="label-for-input" value="Map Location" />
                        <p:inputText value="#{hotelController.hotel.mapLocation}" placeholder="-8.838333,13.234444"
                            styleClass="w-full" />

                    </div>

                    <!-- MEDIA -->
                    <div class="form-section">

                        <h:outputText class="label-for-input" value="Image" />

                        <p:fileUpload value="#{hotelController.imageUpload}" mode="simple" skinSimple="true"
                            allowTypes="/(\.|\/)(gif|jpe?g|png)$/" styleClass="w-full custom-upload-btn" />

                    </div>

                    <!-- ACTIONS -->
                    <div style="display:flex; gap:10px; margin-top:15px">

                        <p:commandButton value="Save" icon="pi pi-save" action="#{hotelController.add}" process="@form"
                            update="@form :hotelTable" onstart="showLoader()"
                            oncomplete="hideLoader(); PF('createDialogHotel').hide()"
                            styleClass="ui-button save-button" />

                        <!-- <p:commandButton value="Update" icon="pi pi-pencil" action="#{hotelController.update}"
                            process="@form" update="@form :hotelTable" styleClass="ui-button-warning" />

                        <p:commandButton value="Clear" type="reset" icon="pi pi-times"
                            styleClass="ui-button-secondary" /> -->

                    </div>

                </div>

            </div>

        </p:dialog>

    </h:form>
</h:body>

</html>
