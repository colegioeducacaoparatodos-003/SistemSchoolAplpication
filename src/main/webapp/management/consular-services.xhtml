<ui:composition template="../components/dashboard/dashboard-layout.xhtml" xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:fn="http://xmlns.jcp.org/jsf/functions">

    <!-- <a href=""></a> -->
    <ui:define name="titulo">
        News
    </ui:define>

    <ui:define name="content">
        <style>

        </style>
        <h:form id="dashboardTable" class="dashboard-form">
            <p:growl id="msg" />
            <h:panelGroup class="table-header">
                <h1 class="table-title">News</h1>

                <p:commandButton styleClass="create-button" value="Create News" type="button"
                    onclick="PF('createDialog').show()" />
            </h:panelGroup>

         
            <p:dataTable
             id="serviceTable" 
            
             styleClass="table"
             value="#{consularServiceController.lazyModel}"
             var="item"
             lazy="true"
             paginator="true"
             paginatorPosition="bottom"
             rows="10"
             emptyMessage="No data found..."
             paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
             currentPageReportTemplate="{startRecord}-{endRecord} of {totalRecords} records"
             rowsPerPageTemplate="5,10,20">

    <!-- Nome -->
    <p:column headerText="Service Name">
        <h:outputText value="#{item.name}" />
    </p:column>

    <!-- Requisitos -->
    <p:column headerText="Requirements">
        <h:outputText value="#{item.requirements}" />
    </p:column>

    <!-- Taxas -->
    <p:column headerText="Fees">
        <h:outputText value="#{item.fees}" />
    </p:column>

    <!-- Preço -->
    <p:column headerText="Price">
        <h:outputText value="#{item.price}">
            <f:convertNumber type="currency" currencySymbol="Kz " />
        </h:outputText>
    </p:column>

    <!-- Estado -->
    <p:column headerText="Status">
        <h:outputText value="#{item.status}" />
    </p:column>

    <!-- Dias disponíveis -->
    <p:column headerText="Available Days">
        <h:outputText value="#{item.availableDays}" />
    </p:column>

    <!-- Online Booking -->
    <p:column headerText="Online Booking">
        <p:tag value="#{item.onlineBooking ? 'Yes' : 'No'}"
               severity="#{item.onlineBooking ? 'success' : 'danger'}" />
    </p:column>

    <!-- Ações -->
    <p:column headerText="Actions">

        <p:button icon="pi pi-pencil"
                  styleClass="rounded-button ui-button-flat ui-button-warning" />

        <p:button icon="pi pi-trash"
                  styleClass="rounded-button ui-button-flat ui-button-danger" />

        <p:button icon="pi pi-eye"
                  styleClass="rounded-button ui-button-flat ui-button-secondary" />

    </p:column>

</p:dataTable>
        </h:form>
        <ui:include src="./consular-services/consular-services-create.xhtml" />


    </ui:define>
</ui:composition>
