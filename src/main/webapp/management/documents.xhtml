<ui:composition template="../components/dashboard/dashboard-layout.xhtml" xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:fn="http://xmlns.jcp.org/jsf/functions">

    <!-- <a href=""></a> -->
    <ui:define name="titulo">
        Documentos
    </ui:define>

    <ui:define name="content">
        <style>

        </style>
        <h:form id="dashboardTable" class="dashboard-form">
            <p:growl id="msg" />
            <h:panelGroup class="header">
                <h1 class="table-title">Documentos</h1>

                <p:commandButton styleClass="create-button" value="Create News" type="button"
                    onclick="PF('createDialog').show()" />
            </h:panelGroup>

            <p:dataTable styleClass="table" value="#{documentController.lazyModel}" var="item" lazy="true" paginator="true"
                paginatorPosition="bottom" rows="10" emptyMessage="No data found..."
                paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                currentPageReportTemplate="{startRecord}-{endRecord} of {totalRecords} records"
                rowsPerPageTemplate="5,10,20">

                <!-- <p:column headerText="Preview" exportable="false">
                    <p:graphicImage value="/news_images/#{item.imageUrl}" rendered="#{not empty item.imageUrl}"
                        style="width: 100%; height: auto; border-radius: 4px;" />
                    <h:outputText value="No Image" rendered="#{empty item.imageUrl}"
                        style="color: #ccc; font-style: italic" />
                </p:column> -->
                <p:column headerText="Id">
                    <h:outputText value="#{item.pkDocument}" />
                </p:column>
                <p:column headerText="Nome de arquivo">
                    <h:outputText value="#{item.fileName}" />
                </p:column>

                
                <p:column headerText="Actions">
                    <p:button icon="pi pi-pencil" styleClass="rounded-button ui-button-flat ui-button-warning" />

                    <p:button icon="pi pi-trash" styleClass="rounded-button ui-button-flat ui-button-danger" />

                    <p:button icon="pi pi-eye" styleClass="rounded-button ui-button-flat ui-button-secondary" />
                </p:column>

            </p:dataTable>
        </h:form>
        <ui:include src="./documents/document-create.xhtml" />


    </ui:define>
</ui:composition>
