<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
        <!-- <ui:insert name="titulo">Signup</ui:insert> -->
    </title>


    <style>
        .add-document-dialog.ui-dialog {
            width: 40% !important;
        }

        body .ui-selectonemenu {
            width: 100%;
        }

        .p-datepicker {
            display: flex;
            width: 100%;
        }

        body .ui-dialog .ui-dialog-titlebar {
            padding: 0;
        }

        .title {
            text-align: center;
            font-size: 1.4rem;
        }
    </style>
</h:head>

<h:body>

    <h:form id="createForm" enctype="multipart/form-data">
        <p:growl id="messages" showDetail="true" />
        <p:dialog id="createDialog" styleClass="add-document-dialog" widgetVar="createDialog" showEffect="fade"
            modal="true" closeOnEscape="true">

            <h1 class="title">Adicionar documento</h1>
            <div class="field mb-3">
                <h:outputText class="label-for-input" value="Nome do Ficheiro" />
                <p:inputText value="#{documentController.document.fileName}" styleClass="w-full" />
            </div>

            <div class="field mb-3">
                <h:outputText class="label-for-input" value="Tipo de Documento" />
                <p:selectOneMenu value="#{documentController.document.documentType}" styleClass="w-full">
                    <f:selectItem itemLabel="Selecione o Tipo" itemValue="" />
                    <f:selectItem itemLabel="Declaração" itemValue="DECLARATION" />
                    <f:selectItem itemLabel="Visto" itemValue="VISAS" />
                    <f:selectItem itemLabel="Acordo de Responsabilidade" itemValue="LIABILITY_AGREEMENT" />
                    <f:selectItem itemLabel="Outro" itemValue="OTHER" />
                </p:selectOneMenu>
            </div>

            <div class="field mb-3">
                <h:outputText class="label-for-input" value="Upload do Documento" />


                <p:fileUpload id="fileUpload" value="#{documentController.document.uploadedFile}" mode="simple"
                    skinSimple="true" allowTypes="/(\.|\/)(gif|jpe?g|png|pdf)$/" label="#{msg.chooseButton}"
                    styleClass="upload-button" />

                <!-- <p:fileUpload mode="simple" multiple="false" update="messages"
                    listener="#{cropUploaderBean.handleFileUpload}">
                    <p:validateFile sizeLimit="102400" allowTypes="/(\.|\/)(pdf|doc|docx|png|jpe?g)$/" />
                </p:fileUpload> -->
            </div>

            <p:commandButton styleClass="save-button" value="Guardar" actionListener="#{documentController.add}"
                update="@form :dashboardTable" onstart="showLoader()" oncomplete="hideLoader(); PF('createDialog').hide()" />
        </p:dialog>

    </h:form>
</h:body>

</html>
