<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
        <!-- <ui:insert name="titulo">Signup</ui:insert> -->
    </title>


</h:head>

<h:body>

<h:form id="createForm"  enctype="multipart/form-data">

    <p:dialog id="createDialog" styleClass="create-news-dialog" widgetVar="createDialog" showEffect="fade" modal="true"
        closeOnEscape="true">
        
            <p:panel header="Destination Registration" style="max-width:900px">
            <p:scrollPanel mode="native">
                <p:panelGrid columns="2" layout="grid"
                            columnClasses="col-4,col-8"
                            styleClass="ui-fluid">

                    <!-- Name -->
                    <p:outputLabel for="name" value="Name"/>
                    <p:inputText id="name"
                                value="#{destinationController.destination.name}"
                                required="true"/>

                    <!-- City -->
                    <p:outputLabel for="city" value="City"/>
                    <p:inputText id="city"
                                value="#{destinationController.destination.city}"/>

                    <!-- Country -->
                    <p:outputLabel for="country" value="Country"/>
                    <p:inputText id="country"
                                value="#{destinationController.destination.country}"/>

                    <!-- Category -->
                    <p:outputLabel for="category" value="Category"/>
                    <p:selectOneMenu id="category"
                                    value="#{destinationController.destination.category}">

                        <f:selectItem itemLabel="Select category" itemValue=""/>

                        <f:selectItem itemLabel="Nature" itemValue="Nature"/>
                        <f:selectItem itemLabel="Beach" itemValue="Beach"/>
                        <f:selectItem itemLabel="City" itemValue="City"/>
                        <f:selectItem itemLabel="Culture" itemValue="Culture"/>
                        <f:selectItem itemLabel="Adventure" itemValue="Adventure"/>

                    </p:selectOneMenu>

                    <!-- Website -->
                    <p:outputLabel for="website" value="Website"/>
                    <p:inputText id="website"
                                value="#{destinationController.destination.website}"/>

                    <!-- Map Location -->
                    <p:outputLabel for="location" value="Map Location"/>
                    <p:inputText id="location"
                                value="#{destinationController.destination.location}"
                                placeholder="-8.838333,13.234444"/>

                    <!-- Description -->
                    <p:outputLabel for="description" value="Description"/>
                    <p:inputTextarea id="description"
                                    rows="4"
                                    value="#{destinationController.destination.description}"/>

                    <!-- Image Upload -->
                    <p:outputLabel value="Image"/>
                

                                   <p:fileUpload  label="#{msg.chooseButton}"
                                styleClass="custom-upload-btn"
                             value="#{destinationController.imageUpload}" 
                            skinSimple="true"
                            mode="simple"
                            allowTypes="/(\.|\/)(gif|jpe?g|png)$/"
                           />

                </p:panelGrid>
                <div style="display:flex; gap:10px">

                    <p:commandButton value="Save"
                                    icon="pi pi-save"
                                    action="#{destinationController.add}"
                                    update="@form destinationTable"
                                    styleClass="ui-button-success"/>

                    <p:commandButton value="Update"
                                    icon="pi pi-pencil"
                                    action="#{destinationController.update}"
                                    update="@form destinationTable"
                                    styleClass="ui-button-warning"/>

                    <p:commandButton value="Clear"
                                    type="reset"
                                    icon="pi pi-times"
                                    styleClass="ui-button-secondary"/>

                </div>
            </p:scrollPanel>
                <p:divider/>

                

            </p:panel>
    </p:dialog>

</h:form>
</h:body>

</html>
