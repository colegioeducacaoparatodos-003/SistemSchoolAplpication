<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
        <!-- <ui:insert name="titulo">Signup</ui:insert> -->
    </title>


</h:head>

<h:body>

<h:form id="createForm"  enctype="multipart/form-data">

  <p:dialog id="createDialog"
          styleClass="create-news-dialog"
          widgetVar="createDialog"
          showEffect="fade"
          modal="true"
          closeOnEscape="true">

    <div class="components-container">

        <!-- LEFT -->
        <div class="left-component">

            <h1 class="title">Preencha os campos para criar destino</h1>

            <!-- BASIC INFO -->
            <div class="form-section">

                <h:outputText class="label-for-input" value="Name" />
                <p:inputText id="name"
                             value="#{destinationController.destination.name}"
                             required="true"
                             styleClass="w-full" />

                <h:outputText class="label-for-input" value="City" />
                <p:inputText id="city"
                             value="#{destinationController.destination.city}"
                             styleClass="w-full" />

                <h:outputText class="label-for-input" value="Country" />
                <p:inputText id="country"
                             value="#{destinationController.destination.country}"
                             styleClass="w-full" />

            </div>

            <!-- CLASSIFICATION -->
            <div class="form-section">

                <h:outputText class="label-for-input" value="Category" />
                <p:selectOneMenu id="category"
                                 value="#{destinationController.destination.category}"
                                 styleClass="w-full">

                    <f:selectItem itemLabel="Select category" itemValue=""/>

                    <f:selectItem itemLabel="Nature" itemValue="Nature"/>
                    <f:selectItem itemLabel="Beach" itemValue="Beach"/>
                    <f:selectItem itemLabel="City" itemValue="City"/>
                    <f:selectItem itemLabel="Culture" itemValue="Culture"/>
                    <f:selectItem itemLabel="Adventure" itemValue="Adventure"/>

                </p:selectOneMenu>

            </div>

        </div>

        <p:divider layout="vertical" />

        <!-- RIGHT -->
        <div class="right-component">

            <!-- LOCATION & LINKS -->
            <div class="form-section">

                <h:outputText class="label-for-input" value="Website" />
                <p:inputText id="website"
                             value="#{destinationController.destination.website}"
                             styleClass="w-full" />

                <h:outputText class="label-for-input" value="Map Location" />
                <p:inputText id="location"
                             value="#{destinationController.destination.location}"
                             placeholder="-8.838333,13.234444"
                             styleClass="w-full" />

            </div>

            <!-- DESCRIPTION -->
            <div class="form-section">

                <h:outputText class="label-for-input" value="Description" />
                <p:inputTextarea id="description"
                                 rows="5"
                                 value="#{destinationController.destination.description}"
                                 styleClass="w-full" />

            </div>

            <!-- MEDIA -->
            <div class="form-section">

                <h:outputText class="label-for-input" value="Image" />

                <p:fileUpload label="#{msg.chooseButton}"
                              styleClass="custom-upload-btn w-full"
                              value="#{destinationController.imageUpload}" 
                              skinSimple="true"
                              mode="simple"
                              allowTypes="/(\.|\/)(gif|jpe?g|png)$/" />

            </div>

            <!-- ACTION -->
            <p:commandButton value="Save Destination"
                             icon="pi pi-save"
                             action="#{destinationController.add}"
                             process="@form"
                             update="@form :destinationTable"
                             onstart="showLoader()"
                             oncomplete="hideLoader(); PF('createDialog').hide()"
                             styleClass="ui-button save-button" />

        </div>

    </div>

</p:dialog>

</h:form>
</h:body>

</html>
