<ui:composition template="../components/dashboard/dashboard-layout.xhtml" xmlns="http://www.w3.org/1999/xhtml"

    <ui:define name="content">
        <style>
           
        </style>
        <h:form id="dashboardTable" class="dashboard-form">
            <p:growl id="msg" />
           
        <h:panelGroup class="table-header">
                <h1 class="table-title">#{msg.travelAgencies}</h1>

                <p:commandButton styleClass="create-button" value="Create New" type="button"
                    onclick="PF('createDialog').show()" />
            </h:panelGroup>

            <p:dataTable  
    id="travelAgencyTable"
    styleClass="table"
    value="#{travelAgencyController.lazyModel}"
    var="t"
    lazy="true"
    paginator="true"
    rows="10"
    responsiveLayout="scroll"
    paginatorPosition="bottom"
    emptyMessage="No travel agency found..."
    paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
    currentPageReportTemplate="{startRecord}-{endRecord} of {totalRecords} records"
    rowsPerPageTemplate="5,10,20">

 <!--    <p:column headerText="Image">

    </p:column> -->

    <!-- Name -->

    </p:column>
 -->
    <!-- Address -->
   <!--  <p:column headerText="website">

    </p:column> -->

    <!-- Phone -->

    </p:column>
 -->

    <!-- Actions -->
    <p:column headerText="Actions">

        <p:commandButton icon="pi pi-pencil"
                        
                         oncomplete="PF('createDialog').show()"
                         action="#{travelAgencyController.setAgency(t)}"
                         styleClass="ui-button-warning"/>

        <p:commandButton icon="pi pi-trash"
                         action="#{travelAgencyController.delete(t.id)}"
                         update="travelAgencyTable"
                         styleClass="ui-button-danger"/>

    </p:column>

            </p:dataTable>
           
        </h:form>
        <ui:include src="./travel-agency/travel-agency-create.xhtml" />
