<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
        <ui:insert name="titulo">Login</ui:insert>
    </title>
    <h:outputStylesheet name="login.css" library="css" />
    <h:outputStylesheet name="general.css" library="css" />
   <script>
            $(document).ready(function () {

                // Chama o remoteCommand após um pequeno delay para garantir que o JSF esteja pronto
                setTimeout(function () {
                    loadRepresentatives();
                }, 100);
            });
     </script>

</h:head>

<h:body >

        <h:form id="dashboardForm" >
            <p:remoteCommand name="loadRepresentatives" 
            action="#{governmentController.load}"
            update="carouselPanel" />

            <main class="home-section random-subjects-section">

                <div class="buttons-container">

                    <h1 class="title">
                        #{msg.officialRepresentatives}
                    </h1>

                    <p class="subtitle">
                        #{msg.officialRepresentativesSubtitle}
                    </p>

                </div>

                <p:carousel
                    id="carouselPanel"
                    value="#{governmentController.representatives}"
                    var="item" 
                    numVisible="3" 
                    numScroll="1"
                    circular="true" 
                    autoplayInterval="4000"  
                    responsive="true" 
                    styleClass="mission-carousel">
                   
                    <div class="member-card">

                        <div class="member-card-content">

                            <div class="member-image-container">
                                <img class="member-image" src="/government_entities_images/#{item.imageGovernment}" 
                                    alt="#{msg.diplomaticStaff}" />
                                
                            </div>

                            <div class="member-info">

                                <h4 class="member-name">
                                            #{item.fullName}

                                </h4>

                                <h6 class="member-role">

                                    
                                    #{item.title}

                                </h6>

                                <p class="member-bio">
                                    <strong>#{item.subTitle}</strong>
                                </p>

                            </div>

                        </div>

                    </div>
                </p:carousel>

            </main>
       </h:form>
</h:body>
</html>
