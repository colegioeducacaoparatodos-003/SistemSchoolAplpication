<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
        <ui:insert name="titulo">Login</ui:insert>
    </title>
    <h:outputStylesheet name="login.css" library="css" />
    <h:outputStylesheet name="general.css" library="css" />



</h:head>

<h:body>

    <main class="home-section random-subjects-section ">
      <div class="buttons-container">
    <h1 class="title">
        #{msg.discoverAngola}
    </h1>

    <p class="subtitle">
        #{msg.exploreAngolaLandscapes}
    </p>
</div>

<div class="discover-angola-section">

    <div class="discover-angola-section-title">

        <i data-aos="fade-down" data-aos-delay="700" class="pi pi-map-marker"></i>

        <div data-aos="fade-right" data-aos-delay="1500"
             class="discover-angola-section-title-text">

            <h1>Angola</h1>

            <p style="color: #fff; font-size: 14pt; text-align: center;">#{msg.firstChoiceDestination}</p>

        </div>
    </div>



            <div class="discover-angola-section-options">
                <p style="color: #fff;">#{msg.angolaTourist}</p>
            </div>
            
   <p:commandButton value="#{msg.learnMore}"
                                  
                                    action="#{destinationController.loadDestinationPage}"
                                   
                                    styleClass="ui-button red-button">

   </p:commandButton>
        

        </div>

    </main>


</h:body>

</html>
