<h:form xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:f="http://xmlns.jcp.org/jsf/core">
    <div class="contactFormOverLay">
        <div class="contactForm">
            <div class="closeContactFormContainer">
                <i id="closeContactForm" class="pi pi-times"></i>
            </div>
            <div class="contactInfo">
                <div class="logo-container logo-contact">
                    <img class="logo" src="../../resources/imgs/logo_governo.png"
                        alt="Emblem of the Republic of Angola" />
                </div>

                <h6>Contact the Embassy</h6>

                <p>From visa applications to consular registration, our diplomatic staff is available to provide
                    assistance
                    and guidance to citizens and visitors.</p>

                <div class="contacts">
                    <ul>
                        <i class="pi pi-phone"></i>
                        <li>Call us (+244 923 445 566)</li>
                    </ul>
                    <i class="pi pi-angle-right"></i>
                </div>

                <div class="contacts">
                    <ul>
                        <i class="pi pi-envelope"></i>
                        <li>Consular Services (consular@angola-argentina.org)</li>
                    </ul>
                    <i class="pi pi-angle-right"></i>
                </div>

                <!-- <div class="contacts">
                <ul>
                    <i class="pi pi-clock"></i>
                    <li>Mon - Fri: 09:00 - 15:30</li>
                </ul>
                <i class="pi pi-angle-right"></i>
            </div> -->
            </div>
        </div>
    </div>
</h:form>
