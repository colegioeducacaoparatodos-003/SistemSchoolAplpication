<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:f="http://xmlns.jcp.org/jsf/core">

    
    <!-- <ui:repeat value="#{governmentController.lazyModel}" var="gov"> -->

     <p:dataScroller class="profiles-grid" value="#{governmentController.lazyModel}" var="item" rows="10" chunkSize="10"
                            mode="horizontal">
        <div class="profile-card">

        <div class="profile-image-embassador">
            <img src="/government_entities_images/#{item.imageGovernment}" alt=""
             class="profile-img" />

            <!-- <img src="#{request.contextPath}/resources/imgs/angolan-president-photo.jpg"
                alt="Embaixador de Angola"
                class="profile-img" /> -->
        </div>

        <div class="profile-info">

            <p:tag value="#{item.title}" class="tag-embassador" severity="info" />

            <h3 class="profile-name">
                #{item.fullName}
            </h3>

            <p class="profile-title">
                 #{item.type}
            </p>

            <!-- <p class="profile-subtitle">
                 #{gov.subTitle}
            </p> -->

            <div class="profile-meta">
                <p><strong>#{item.subTitle}</strong></p>
            </div>

            <p class="profile-desc">
                #{item.description}
            </p>

        </div>

        </div>
     </p:dataScroller>
    <!-- </ui:repeat> -->

</html>
