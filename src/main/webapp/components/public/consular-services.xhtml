<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
        <ui:insert name="titulo">Login</ui:insert>
    </title>
    <!-- <h:outputStylesheet name="login.css" library="css" /> -->
    <h:outputStylesheet name="general.css" library="css" />
    <h:outputScript name="general.js" library="js" />

    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>


</h:head>

<h:body>

    <main class="consular-services-section home-section">
        <h1 data-aos="fade-right" data-aos-delay="300" class="title">#{msg.consularServices}</h1>

        <p data-aos="fade-right" data-aos-delay="500" class="subtitle">
            #{msg.consularServicesSubtitle}
        </p>

        <div class="cards-container">

            <div data-aos="fade-right" data-aos-delay="800" class="card">
                <p>#{msg.nationalIdCardRenewal}</p>
                <div class="icon-container">
                    <i class="pi pi-bookmark"></i>
                </div>
            </div>

            <div data-aos="fade-right" data-aos-delay="1000" class="card">
                <p>#{msg.passportApplication}</p>
                <div class="icon-container">
                    <i class="pi pi-bookmark"></i>
                </div>
            </div>

            <div data-aos="fade-right" data-aos-delay="1200" class="card">
                <p>#{msg.visaServices}</p>
                <div class="icon-container">
                    <i class="pi pi-bookmark"></i>
                </div>
            </div>

            <div data-aos="fade-right" data-aos-delay="1400" class="card">
                <p>#{msg.birthRegistrationMarriage}</p>
                <div class="icon-container">
                    <i class="pi pi-bookmark"></i>
                </div>
            </div>

            <div data-aos="fade-right" data-aos-delay="1600" class="card">
                <p>#{msg.consularRegistrationLegalization}</p>
                <div class="icon-container">
                    <i class="pi pi-bookmark"></i>
                </div>
            </div>

            <a href="./consular-services.xhtml" data-aos="fade-right" data-aos-delay="1800"
                class="card link-for-page-list">

                <p>#{msg.seeAllServices}</p>

                <div class="icon-container">
                    <i class="pi pi-arrow-right"></i>
                </div>
            </a>

        </div>
    </main>


</h:body>

</html>
