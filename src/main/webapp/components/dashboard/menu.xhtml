<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:p="http://primefaces.org/ui"
    xmlns:f="http://xmlns.jcp.org/jsf/core">

    <div class="layout-menu">
        <h:form id="menuForm">
            <p:toolbar styleClass="dashboard-topbar shadow-sm">
                <f:facet name="left">
                    <div class="ui-toolbar-group-left">
                        <!-- Botão que chama a sidebar visível APENAS em telas mobile/app (esconde em lg e acima) -->
                        <p:commandButton id="sidebarToggler" icon="pi pi-bars" process="@none"
                            styleClass="sidebar-toggle-button ui-button-flat d-lg-none" type="button"
                            aria-label="#{msg.toggleSidebar}" onclick="toggleSidebar(); return false;" />
                        <p:button value="#{msg.dashboard}"
                            outcome="/components/public/dashboard.xhtml"
                            icon="pi pi-home" styleClass="dashboard-nav-button ui-button-flat" />
                    </div>
                </f:facet>

                <f:facet name="right">
                    <div class="ui-toolbar-group-right">
                        <!-- Language Switcher -->
                        <p:commandButton id="langMenuButton" icon="pi pi-globe" type="button"
                            styleClass="rounded-button ui-button-flat" aria-label="#{msg.toggleLanguageMenu}" />
                        <p:menu overlay="true" trigger="langMenuButton" my="left top" at="left bottom">
                            <p:menuitem value="Português" actionListener="#{languageController.actionPortugues}"
                                update="@all" />
                            <p:menuitem value="Español" actionListener="#{languageController.actionEspanhol}"
                                update="@all" />
                        </p:menu>

                        <!-- User Menu -->
                        <p:commandButton id="userAvatar" icon="pi pi-user" styleClass="rounded-button ui-button-flat"
                            type="button" aria-label="#{msg.toggleUserMenu}" />
                        <p:menu overlay="true" trigger="userAvatar" my="right top" at="right bottom"
                            styleClass="user-dropdown">
                            <f:facet name="header">
                                <div class="user-dropdown-header p-2">
                                    <h:outputText value="#{sessionBean.loggedUser.email}"
                                        styleClass="fw-bold d-block text-truncate" style="max-width: 180px;" />
                                    <h:outputText value="#{msg[sessionBean.loggedUser.perfil.toString()]}"
                                        styleClass="text-muted small" />
                                </div>
                            </f:facet>
                            <p:menuitem value="#{msg.profile}" icon="pi pi-user" url="#" />
                            <p:menuitem value="#{msg.status}" icon="pi pi-info-circle" url="#" />
                            <p:divider />
                            <p:menuitem value="#{msg.logout}" icon="pi pi-sign-out" action="#{userController.logout}"
                                styleClass="logout-item text-danger" />
                        </p:menu>
                    </div>
                </f:facet>
            </p:toolbar>
        </h:form>
    </div>

    <h:outputScript>
        // <![CDATA[
        function toggleSidebar() {
            var layout = document.querySelector('.dashbord-layout');
            if (layout) {
                layout.classList.toggle('sidebar-visible');
            }
        }
        // ]]>
    </h:outputScript>

</ui:composition>
