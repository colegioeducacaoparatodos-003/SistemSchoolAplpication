<h:form xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:f="http://xmlns.jcp.org/jsf/core">
    <div class="contactFormOverLay">
        <div class="contactForm signup">
            <div class="closeContactFormContainer">
                <i id="closeContactForm" class="pi pi-times"></i>
            </div>
            <div class="contactInfo">
                <div class="logo-container logo-contact">
                    <img class="logo" src="../../resources/imgs/logo_governo.png"
                        alt="Emblem of the Republic of Angola" />
                </div>

                <h6>Sign up</h6>
                    
                <div class="form-group">
                    <p:outputLabel styleClass="block" value="Email" />

                    <p:inputText />

                </div>
                <div class="form-group">
                    <p:outputLabel styleClass="block" value="Email" />

                    <p:inputText />

                </div>
                <div class="form-group">
                    <p:outputLabel styleClass="block" value="Email" />

                    <p:inputText />

                </div>
                <div class="form-group">
                    <p:outputLabel styleClass="block" value="Email" />

                    <p:inputText />

                </div>
                <div class="form-group">
                    <p:outputLabel styleClass="block" value="Email" />

                    <p:inputText />

                </div>
                <div class="form-group">
                    <p:outputLabel styleClass="block" value="Email" />

                    <p:inputText />

                </div>
                 <div class="form-group upload-group">
                          <p:outputLabel value="Image" styleClass="upload-label" />
                        <span class="ui-input-icon-left transparentUploadFile upload-container">
                            <p:fileUpload id="fileUpload" mode="simple"
                                skinSimple="true" allowTypes="/(\.|\/)(gif|jpe?g|png|pdf)$/" 
                                label="Upload an image"
                                styleClass="upload-button" />
                        </span>
                    </div>

                <div class="form-group">
                    <p:outputLabel styleClass="block" value="Password" />
                    <span class="ui-input-icon-left">
                        <i class="pi pi-search" />
                        <p:password id="password" styleClass="block" redisplay="true" toggleMask="true"
                            required="true" />
                    </span>
                </div>

                <div class="signup-button-container">
                    <p:commandButton styleClass="btn-primary login-button" value="Login" ajax="false" />
                </div>

            </div>
        </div>
    </div>
</h:form>
