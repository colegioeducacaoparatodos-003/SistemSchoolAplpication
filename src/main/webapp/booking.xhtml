<ui:composition template="./components/public/public-pages-layout.xhtml" xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:fn="http://xmlns.jcp.org/jsf/functions"
    id="maintenanceKpiSidebar">

    <f:metadata>
    </f:metadata>

    <ui:define name="titulo">
        #{msg.book}
    </ui:define>


    <ui:define name="content">
        <style>
            .booking-content-container {
                padding: 4rem 6rem;
            }

            .booking-btn {
                border: none;
                color: white;
                font-weight: 600;
                border-radius: 8px;
                padding: 6px 14px;
                transition: all 0.3s ease;
            }

            .booking-content-container{
                width: 64%;
    
                margin: 0 auto;

            }

            .card {
                flex-direction: column;
                display: flex;
                gap: .8rem;

                background: #ffffff;
                border: 1px solid #e0e6ed;
                border-radius: 12px;
                padding: 24px;
                /* width: 100%; */
                /* max-width: 800px; */
                position: relative;
                box-shadow: rgba(149, 157, 165, 0.2) 0px 8px 24px;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            }

            .header {
                text-align: center;
            }

            .booking-button.ui-button {
                width: 100%;
                padding: .4rem;
            }

            .booking-btn.active {
                background-color: #DA291C;
                cursor: pointer;
            }

            .booking-btn.active:hover {
                opacity: 0.85;
            }

            .booking-btn.inactive {
                background-color: rgb(95, 99, 107);
                cursor: not-allowed;
            }

            .back-button.ui-commandlink {
                color: #333;
                display: block;
                width: fit-content;
                margin: 2rem 0;
            }
        </style>


        <h:body>
            <h:form id="newsForm">
                <p:growl id="msg" />
                <section class="booking-content-container">


                  <div class="content-container">
                      <p:commandLink action="#{consularServiceController.loadConsularServicePage}" class="back-button">
                        <i class="pi  pi-arrow-left" style="font-size: 2rem"></i>
                    </p:commandLink>


                    <div class="card">
                        <div class="header">
                            <!-- <div class="icon">
                                <i class="pi pi-calendar-plus" style="font-size: 2rem;"></i>
                            </div> -->

                            <h1>Efetuar Reserva</h1>

                            <p>Preencha os campos abaixo para realizar a sua reserva</p>
                        </div>

                        <p:inputText value="#{consularServiceController.booking.fullName}" placeholder="Full Name" />

                        <span class="ui-input-icon-left">
                            <i class="pi pi-envelope" />
                            <p:inputText value="#{consularServiceController.booking.email}" placeholder="Email" />

                        </span>


                        <span class="ui-input-icon-left">
                            <i class="pi pi-phone" />
                            <p:inputText value="#{consularServiceController.booking.phone}" placeholder="Phone" />

                        </span>

                        <div style="display: flex; flex-direction: column;">
                            <p:outputLabel value="#{msg.date}" />
                            <p:datePicker value="#{consularServiceController.booking.bookingDate}" showIcon="true"
                                showOnFocus="false" />

                        </div>

                        <p:selectOneMenu value="#{consularServiceController.booking.bookingTime}">
                            <f:selectItem itemLabel="08:00" itemValue="08:00" />
                            <f:selectItem itemLabel="09:00" itemValue="09:00" />
                        </p:selectOneMenu>

                        <p:commandButton ajax="false" styleClass="ui-button red-button booking-button"
                            value="#{msg.finalizeScheduling}" action="#{consularServiceController.booking}" />
                    </div>
                  </div>
                </section>


            </h:form>
            <ui:include src="./components/public/footer.xhtml" />
        </h:body>
    </ui:define>
</ui:composition>
