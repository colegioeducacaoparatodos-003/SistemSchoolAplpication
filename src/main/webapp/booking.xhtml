<ui:composition template="./components/public/public-pages-layout.xhtml" xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:fn="http://xmlns.jcp.org/jsf/functions"
    id="maintenanceKpiSidebar">

    <f:metadata>
    </f:metadata>

    <ui:define name="titulo">
        #{msg.consularServices}
    </ui:define>


    <ui:define name="content">
        <style>

            .booking-btn {
    border: none;
    color: white;
    font-weight: 600;
    border-radius: 8px;
    padding: 6px 14px;
    transition: all 0.3s ease;
}

.booking-btn.active {
    background-color: #DA291C;
    cursor: pointer;
}

.booking-btn.active:hover {
    opacity: 0.85;
}

.booking-btn.inactive {
    background-color: rgb(55, 65, 81);
    cursor: not-allowed;
}

        </style>


        <h:body>
            <h:form id="newsForm">
<p:growl id="msg" />
                <section class="public-page-table-1 consular-services-page-container">

                    <div class="card">
                        <p:inputText value="#{consularServiceController.booking.fullName}" placeholder="Full Name" />
                        <p:inputText value="#{consularServiceController.booking.email}" placeholder="Email" />
                        <p:inputText value="#{consularServiceController.booking.phone}" placeholder="Phone" />
                        <p:datePicker value="#{consularServiceController.booking.bookingDate}" />
                        <p:selectOneMenu value="#{consularServiceController.booking.bookingTime}">
                            <f:selectItem itemLabel="08:00" itemValue="08:00"/>
                            <f:selectItem itemLabel="09:00" itemValue="09:00"/>
                        </p:selectOneMenu>

                        <p:commandButton ajax="false" styleClass="ui-button red-button" value="#{msg.finalizeScheduling}"
                                        action="#{consularServiceController.booking}" />
                    </div>
                </section>


            </h:form>
            <ui:include src="./components/public/footer.xhtml" />
        </h:body>
    </ui:define>
</ui:composition>
