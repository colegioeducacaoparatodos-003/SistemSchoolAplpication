<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:f="http://xmlns.jcp.org/jsf/core">

<f:view locale="#{languageController.locale}">
    <h:head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>
            <ui:insert name="titulo">Login</ui:insert>
        </title>

        <h:outputStylesheet name="general.css" library="css" />

        <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
        <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

        <h:outputScript name="general.js" library="js" />

    </h:head>

    <h:body>
        <div class="auth-container login">

            <header>
                <div class="logo-container">
                    <p:link outcome="/index">
                        <img class="logo" src="../../resources/imgs/logo_governo.png" alt="" />
                    </p:link>
                </div>

                <h:form id="langForm">
                    <p:menubar class="language-selector" hideDelay="1000">

                        <f:facet name="end">

                            <p:menuButton styleClass="languageBtn" icon="pi pi-fw pi-globe">

                                <p:menuitem value="Português" action="#{languageController.setLanguage('pt')}"
                                    ajax="false" update="@all" process="@this" />

                                <p:menuitem value="English" action="#{languageController.setLanguage('en')}"
                                    ajax="false" update="@all" process="@this" />

                                <p:menuitem value="Español" action="#{languageController.setLanguage('es')}"
                                    ajax="false" update="@all" process="@this" />

                            </p:menuButton>

                            <p:commandButton style="display: none;" id="openMobileMenu" icon="pi pi-bars"
                                styleClass="loginBtn open-menu-button" type="button" />

                        </f:facet>
                    </p:menubar>
                </h:form>

            </header>

            <h:form id="loginForm">

                <img class="insignia" src="../../resources/imgs/insignia.png" alt="" />

                <h2>#{msg.accessEmbassyPortalDashboard}</h2>

                <div class="form-group">

                    <p:outputLabel styleClass="block" value="#{msg.email}" />

                    <p:inputText value="#{userController.loginEmail}" />

                </div>

                <div class="form-group">

                    <p:outputLabel styleClass="block" value="#{msg.password}" />

                    <span class="ui-input-icon-left">
                        <i class="pi pi-search" />
                        <p:password 
                         value="#{userController.loginPassword}" 
                        id="password" styleClass="block" redisplay="true" toggleMask="true"
                            required="true" />
                    </span>

                </div>

                <div class="login-button-container links">

                    <h:link class="link" value="#{msg.forgotYourPassword}" />

                    <h:link class="link" outcome="signup" value="#{msg.signUp}" />

                </div>

                <div class="login-button-container">
                    <p:commandButton 
                      action="#{userController.login}" 
                    styleClass="btn-primary login-button" value="#{msg.login}" ajax="false" />
                </div>

            </h:form>

            <div class="auth-footer">

                <p class="security-notice">
                    #{msg.securityNoticeText}
                </p>

                <p class="copyright">
                    © <span id="currentYear"></span> #{msg.embassyPortalCopyright}
                </p>

            </div>

        </div>
        <ui:include src="./components/dashboard/sign-up-dialog.xhtml" />
    </h:body>
</f:view>

</html>
