<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
        <ui:insert name="titulo">Angola Embassy</ui:insert>
    </title>

</h:head>

<h:body>

    <h:form enctype="multipart/form-data">

        <p:panel header="Upload de Documento">
            <p:messages id="msgs" autoUpdate="true" />

            <!-- Componente de upload -->
            <p:fileUpload value="#{documentController.document.uploadedFile}" mode="simple" label="Escolher arquivo"
                allowTypes="/(\.|\/)(pdf|docx|xlsx|jpg|png)$/" auto="false" />

            <!-- Botão para enviar -->
            <p:commandButton value="Upload" action="#{documentController.upload}" update="@form" />
        </p:panel>

    </h:form>

    <p:dataTable value="#{documentController.lazyModel}" var="doc" lazy="true" paginator="true" rows="10">

        <p:column headerText="Nome do Arquivo">
            #{doc.fileName}
        </p:column>

        <p:column headerText="Tipo">
            #{doc.documentType}
        </p:column>

        <p:column headerText="Tamanho">
            #{doc.fileSize} bytes
        </p:column>

        <p:column headerText="Upload Date">
            #{doc.uploadDate}
        </p:column>

        <p:column headerText="Ações">
            <!-- Botão de Download -->
            <p:commandButton value="Download" icon="pi pi-download" update="@form">
                <p:ajax listener="#{documentController.prepareDownload(doc.pkDocument)}" />
                <p:fileDownload value="#{documentController.fileToDownload}" />
            </p:commandButton>
        </p:column>

    </p:dataTable>

</h:body>

</html>
