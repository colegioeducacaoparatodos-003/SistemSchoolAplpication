<ui:composition template="./components/dashboard/dashboard-layout.xhtml" xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:fn="http://xmlns.jcp.org/jsf/functions"
    id="maintenanceKpiSidebar">

  <f:metadata>
    <!-- <f:event type="preRenderView" listener="#{userController.ensureLoggedIn}" /> -->
</f:metadata>


    <ui:define name="titulo">
        Dashboard
    </ui:define>

    <ui:define name="content">
        <h:form id="dashboardForm">
            <h1>Angola Embassy</h1>
        </h:form>
    </ui:define>
</ui:composition>

<p:dataTable value="#{newsController.lazyModel}" var="news"
             lazy="true" paginator="true" rows="10"
             rowKey="#{news.id}">
    <p:column headerText="Título">
        #{news.title}
    </p:column>
    <p:column headerText="Autor">
        #{news.author}
    </p:column>
    <p:column headerText="Data">
        #{news.publishedAt}
    </p:column>
</p:dataTable>
