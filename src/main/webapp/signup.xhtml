<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:f="http://xmlns.jcp.org/jsf/core">

<f:view locale="#{languageController.locale}">
    <h:head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>
            <ui:insert name="titulo">Signup</ui:insert>
        </title>

        <h:outputStylesheet name="general.css" library="css" />

        <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
        <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

        <h:outputScript name="general.js" library="js" />

    </h:head>

    <h:body>
        <div class="auth-container auth-signup">
            <header>
                <div class="logo-container">
                    <p:link outcome="/index">
                        <img class="logo" src="../../resources/imgs/logo_governo.png" alt="" />
                    </p:link>

                </div>
                <h:form id="langForm">

                    <p:menubar class="language-selector" hideDelay="1000">

                        <f:facet name="end">

                            <p:menuButton styleClass="languageBtn" icon="pi pi-fw pi-globe">
                                <p:menuitem value="Português" action="#{languageController.setLanguage('pt')}"
                                    ajax="false" update="@all" process="@this" />

                                <p:menuitem value="English" action="#{languageController.setLanguage('en')}"
                                    ajax="false" update="@all" process="@this" />
                                <p:menuitem value="Español" action="#{languageController.setLanguage('es')}"
                                    ajax="false" update="@all" process="@this" />
                            </p:menuButton>

                            <p:commandButton style="display: none;" id="openMobileMenu" icon="pi pi-bars"
                                styleClass="loginBtn open-menu-button" type="button" />
                        </f:facet>
                    </p:menubar>

                </h:form>
            </header>
            <h:form id="signupForm">

                <img class="insignia" src="../../resources/imgs/insignia.png" alt="" />

                <h2>#{msg.createAccount}</h2>

                <div class="dual-inputs-container">
                    <div class="dual-form-group">
                        <p:outputLabel styleClass="block" value="#{msg.firstName}" for="fname" />
                        <p:inputText id="fname" required="true" />
                    </div>

                    <div class="dual-form-group">
                        <p:outputLabel styleClass="block" value="#{msg.middleName}" for="mname" />
                        <p:inputText id="mname" />
                    </div>
                </div>

                <div class="dual-inputs-container">
                    <div class="dual-form-group">
                        <p:outputLabel styleClass="block" value="#{msg.lastName}" for="lname" />
                        <p:inputText id="lname" required="true" />
                    </div>

                    <div class="dual-form-group">
                        <p:outputLabel styleClass="block" value="#{msg.email}" for="email" />
                        <p:inputText id="email" required="true" />
                    </div>
                </div>

                <div class="dual-inputs-container">
                    <div class="dual-form-group">
                        <p:outputLabel styleClass="block" value="#{msg.password}" for="pwd1" />
                        <p:password id="pwd1" toggleMask="true" match="pwd2" required="true" />
                    </div>

                    <div class="dual-form-group">
                        <p:outputLabel styleClass="block" value="#{msg.confirmPassword}" for="pwd2" />
                        <p:password id="pwd2" toggleMask="true" required="true" />
                    </div>
                </div>

                <div class="dual-form-group upload-group">
                    <p:outputLabel value="#{msg.image}" styleClass="upload-label" />

                    <span class="ui-input-icon-left transparentUploadFile upload-container">
                        <p:fileUpload id="fileUpload" mode="simple" skinSimple="true"
                            allowTypes="/(\.|\/)(gif|jpe?g|png|pdf)$/" label="#{msg.uploadImage}"
                            styleClass="upload-button" />
                    </span>
                </div>

                <div class="login-button-container">
                    <p:commandButton styleClass="btn-primary login-button" value="#{msg.createAccount}" ajax="false" />
                </div>

                <div class="login-button-container links">
                    <h:link class="link" outcome="login" value="#{msg.goBackToLogin}" />
                </div>

            </h:form>
            <div class="auth-footer">

                <p class="security-notice">
                    #{msg.securityNoticeText}
                </p>

                <p class="copyright">
                    © <span id="currentYear"></span> #{msg.embassyPortalCopyright}
                </p>

            </div>
        </div>
    </h:body>
</f:view>

</html>
