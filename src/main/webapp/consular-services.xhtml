<ui:composition template="./components/public/public-pages-layout.xhtml" xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:fn="http://xmlns.jcp.org/jsf/functions"
    id="maintenanceKpiSidebar">

    <f:metadata>
    </f:metadata>

    <ui:define name="titulo">
        #{msg.consularServices}
    </ui:define>


    <ui:define name="content">
        <style>

            .booking-btn {
    border: none;
    color: white;
    font-weight: 600;
    border-radius: 8px;
    padding: 6px 14px;
    transition: all 0.3s ease;
    border: none !important;
}

.booking-btn.active {
    background-color: #DA291C;
    cursor: pointer;
}

.booking-btn.active:hover {
    color: var(--white-color);
    background-color: var(--angola-red-hover) !important;
}

.booking-btn.inactive {
    background-color: rgb(55, 65, 81);
    cursor: not-allowed;
}

.info-row-schedule-and-price{
    
    justify-content: space-between;
    font-weight: 700;
    color: #000;
}

.info-row-schedule-and-price-label,
.info-row-schedule-and-price-value{

    color: #000 !important;
}

.card:hover{
      background-color: #ededed;
}

.btn-download.ui-button.ui-button-icon-only .ui-icon
{
      color: #DA291C;
}


        </style>


        <h:body>
            <h:form id="newsForm">

                <section class="public-page-table-1 consular-services-page-container">

                    <div class="content-container">

                        <h:panelGroup class="side-bar">
                            <h2>#{msg.consularServices}</h2>

                            <div class="check-boxes-container">

                                <p:selectBooleanCheckbox itemLabel="#{msg.passportServices}" />
                                <p:divider />

                                <p:selectBooleanCheckbox itemLabel="#{msg.visaApplications}" />
                                <p:divider />

                                <p:selectBooleanCheckbox itemLabel="#{msg.legalizationAttestation}" />
                                <p:divider />

                                <p:selectBooleanCheckbox itemLabel="#{msg.emergencyTravelDocuments}" />
                                <p:divider />

                                <p:selectBooleanCheckbox itemLabel="#{msg.birthMarriageRegistration}" />
                                <p:divider />

                                <p:selectBooleanCheckbox itemLabel="#{msg.citizenshipNationality}" />
                                <p:divider />

                                <p:selectBooleanCheckbox itemLabel="#{msg.notaryServices}" />
                                <p:divider />

                                <p:selectBooleanCheckbox itemLabel="#{msg.policeClearanceCertificates}" />
                                <p:divider />

                                <p:selectBooleanCheckbox itemLabel="#{msg.repatriationAssistance}" />
                                <p:divider />

                                <p:selectBooleanCheckbox itemLabel="#{msg.overseasVotingRegistration}" />
                                <p:divider />

                                <p:selectBooleanCheckbox itemLabel="#{msg.identificationCardsID}" />
                                <p:divider />

                                <p:selectBooleanCheckbox itemLabel="#{msg.socialSecurityPensions}" />
                                <p:divider />

                                <p:selectBooleanCheckbox itemLabel="#{msg.deathRegistrationTransport}" />
                                <p:divider />

                                <p:selectBooleanCheckbox itemLabel="#{msg.affidavitsDeclarations}" />
                                <p:divider />

                                <p:selectBooleanCheckbox itemLabel="#{msg.changeOfNameStatus}" />
                                <p:divider />

                                <p:selectBooleanCheckbox itemLabel="#{msg.translationServices}" />
                                <p:divider />

                                <p:selectBooleanCheckbox itemLabel="#{msg.childAdoptionServices}" />
                                <p:divider />

                                <p:selectBooleanCheckbox itemLabel="#{msg.powerOfAttorney}" />
                                <p:divider />

                                <p:selectBooleanCheckbox itemLabel="#{msg.generalInquiries}" />

                            </div>
                        </h:panelGroup>

                        <h:panelGroup class="body">
                            <p:dataScroller value="#{consularServiceController.lazyModel}" var="item" rows="10"
                                chunkSize="10" mode="inline">
                                <div class="card">

                                    <!-- Bookmark -->
                                    <div class="bookmark-container">
                                        

                                         <p:commandButton icon="pi pi-download"
                                         ajax="false"
                         styleClass="rounded-button ui-button-flat ui-button-danger" 
                         action="#{consularServiceController.downloadConsularServiceReportPDF}"
                                         
                        >
                        <f:setPropertyActionListener value="#{item.pkService}" target="#{consularServiceController.selectedServiceId}" />
                          </p:commandButton>


                                    </div>

                                    <!-- Title -->
                                    <h4 class="service-title">
                                        #{item.name}
                                    </h4>

                                    <!-- Status -->
                                    <div class="info-row">
                                        <i class="pi pi-info-circle"></i>
                                        <span class="label">#{msg.status}</span>
                                        <span class="value">#{item.status}</span>
                                    </div>

                                    <!-- Price / Fees -->
                                    

                                    <div class="info-row">
                                        <i class="pi pi-wallet"></i>
                                        <span class="label">#{msg.fees}</span>
                                        <span class="value">#{item.fees}</span>
                                    </div>

                                    <!-- Requirements -->
                                    <div class="info-row">
                                        <i class="pi pi-list"></i>
                                        <span class="label">#{msg.requirements}</span>
                                        <span class="value">#{item.requirements}</span>
                                    </div>

                                    <!-- Available Days -->
                                    <div class="info-row">
                                        <i class="pi pi-calendar"></i>
                                        <span class="label">#{msg.availableDays}</span>
                                        <span class="value">#{item.availableDays}</span>
                                    </div>

                                    <!-- Online Booking 
                                    <div class="info-row">
                                        <i class="pi pi-globe"></i>
                                        <span class="label">#{msg.onlineBooking}</span>
                                        <span class="value">
                                            <h:outputText value="#{item.onlineBooking ? msg.yes : msg.no}" />
                                        </span>
                                    </div>-->

                                     <!-- Description -->
                                    <p class="description">
                                        #{item.details}
                                    </p>

                                    <div class="info-row info-row-schedule-and-price">
                                       
                                        <p:commandButton 
                                             value="#{msg.schedule}" 
                                            action="#{consularServiceController.goToBooking(item.pkService)}"
                                            ajax="false"
                                            styleClass="booking-btn #{item.onlineBooking ? 'active' : 'inactive'}"
                                            disabled="#{!item.onlineBooking}" />

                                            <div class="info-row">
                                                <i class="pi pi-dollar"></i>
                                                <span class="info-row-schedule-and-price-label">#{msg.price} #{item.price} </span>
                                                
                                            </div>
                                    </div>

                                   

                                </div>
                                <!-- <div class="card">
                                    <div class="bookmark-container">
                                        <i class="pi pi-bookmark-fill"></i>
                                    </div>

                                    <h4 class="service-title">
                                        #{item.name}
                                    </h4>

                                    <div class="info-row">
                                        <i class="pi pi-building"></i>
                                        <span class="label">#{msg.serviceProviderLabel}</span>
                                        <span class="value">#{msg.serviceProviderValue}</span>
                                    </div>

                                    <div class="info-row">
                                        <i class="pi pi-file-edit"></i>
                                        <span class="label">#{msg.serviceModeLabel}</span>
                                        <span class="value">#{msg.serviceModeValue}</span>
                                    </div>

                                    <p class="description">
                                        #{item.details}
                                    </p>

                                </div> -->
                            </p:dataScroller>


                        </h:panelGroup>

                    </div>

                </section>


            </h:form>
            <ui:include src="./components/public/footer.xhtml" />
        </h:body>
    </ui:define>
</ui:composition>
