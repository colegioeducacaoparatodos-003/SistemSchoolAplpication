<ui:composition template="./components/public/public-pages-layout.xhtml" xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:fn="http://xmlns.jcp.org/jsf/functions"
    id="maintenanceKpiSidebar">

    <f:metadata>
    </f:metadata>

    <ui:define name="titulo">
        #{msg.consularServices}
    </ui:define>


    <ui:define name="content">
        <style>

.destinations-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:30px;
}

.destination-card{
    background:var(--title-gray);
    border-radius:14px;
    padding:25px;
    color:white;
    position:relative;
}

.destination-image{
    display:flex;
    justify-content:center;
    margin-bottom:20px;
}

.destination-img{
    width:150px;
    height:150px;
    border-radius:50%;
    object-fit:cover;
}

.destination-content h3{
    font-size:22px;
    margin-bottom:8px;
}

.destination-location{
    color:#ff7a00;
    font-size:14px;
    margin-bottom:10px;
}

.destination-description{
    color:#cfd3ff;
    margin-bottom:20px;
}

.destination-link{
    color:white;
    border-bottom:2px solid #ff7a00;
    text-decoration:none;
}
.destinations-page-container .footer{
    display: flex;
    justify-content: space-between;
}
        </style>



<h:body>
    <h:form id="newsForm">

        <section class="destinations-page-container">

            <div class="destinations-grid">

                <ui:repeat value="#{destinationController.destinations}" var="d">

                    <div class="destination-card">

                        <!-- Image -->
                        <div class="destination-image">

                            <p:graphicImage
                                value="/destination_images/#{d.imageUrl}"
                                styleClass="destination-img"/>

                        </div>

                        <!-- Content -->
                        <div class="destination-content">

                            <h3>
                                #{d.name}
                            </h3>

                            <p class="destination-location">
                                #{d.city}, #{d.country}
                            </p>

                            <p class="destination-description">
                                #{d.description}
                            </p>


                            <p:commandLink
                                value="Explore Destination →"
                                styleClass="destination-link"/>
                           
                        </div>

                    </div>

                </ui:repeat>

            </div>

        </section>

    </h:form>

    <ui:include src="./components/public/footer.xhtml"/>

</h:body>
    </ui:define>
</ui:composition>
